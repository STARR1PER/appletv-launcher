ddingTop=\"10dp\"\n    android:paddingBottom=\"6dp\">\n\n    <FrameLayout\n        android:id=\"@+id/appCardView\"\n        android:layout_width=\"176dp\"\n        android:layout_height=\"99dp\"\n        android:background=\"@drawable/bg_card_rounded\"\n        android:clickable=\"true\"\n        android:focusable=\"true\"\n        android:elevation=\"6dp\">\n\n        <ImageView\n            android:id=\"@+id/appCardArtwork\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"match_parent\"\n            android:scaleType=\"centerCrop\" />\n\n        <View\n            android:id=\"@+id/focusGloss\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"match_parent\"\n            android:background=\"@drawable/bg_gloss\"\n            android:alpha=\"0\" />\n\n        <TextView\n            android:id=\"@+id/tvCardBadge\"\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"wrap_content\"\n            android:layout_gravity=\"top|end\"\n            android:layout_margin=\"5dp\"\n            android:background=\"#DD007AFF\"\n            android:paddingStart=\"6dp\"\n            android:paddingEnd=\"6dp\"\n            android:paddingTop=\"2dp\"\n            android:paddingBottom=\"2dp\"\n            android:text=\"◄ ДВИГАТЬ ►\"\n            android:textColor=\"#FFFFFF\"\n            android:textSize=\"8sp\"\n            android:textStyle=\"bold\"\n            android:visibility=\"gone\" />\n\n        <View\n            android:id=\"@+id/focusBorder\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"match_parent\"\n            android:background=\"@drawable/bg_focus_border\"\n            android:alpha=\"0\" />\n    </FrameLayout>\n\n    <TextView\n        android:id=\"@+id/tvTileName\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:layout_marginTop=\"16dp\"\n        android:maxWidth=\"176dp\"\n        android:singleLine=\"true\"\n        android:ellipsize=\"end\"\n        android:alpha=\"0\"\n        android:textColor=\"#FFFFFF\"\n        android:textSize=\"14sp\"\n        android:textStyle=\"bold\"\n        android:shadowColor=\"#CC000000\"\n        android:shadowDx=\"0\"\n        android:shadowDy=\"2\"\n        android:shadowRadius=\"6\" />\n</LinearLayout>\nEOF\n\ncat << 'EOF' > app/src/main/java/com/appletv/launcher/MainActivity.kt\npackage com.appletv.launcher\n\nimport android.Manifest\nimport android.app.Activity\nimport android.app.Dialog\nimport android.content.Context\nimport android.content.Intent\nimport android.content.SharedPreferences\nimport android.content.pm.ApplicationInfo\nimport android.content.pm.PackageManager\nimport android.content.pm.ResolveInfo\nimport android.graphics.*\nimport android.graphics.drawable.Drawable\nimport android.graphics.drawable.GradientDrawable\nimport android.net.ConnectivityManager\nimport android.net.NetworkCapabilities\nimport android.net.Uri\nimport android.os.Build\nimport android.os.Bundle\nimport android.os.Environment\nimport android.os.Handler\nimport android.os.Looper\nimport android.provider.Settings\nimport android.view.Gravity\nimport android.view.KeyEvent\nimport android.view.View\nimport android.view.ViewGroup\nimport android.view.ViewOutlineProvider\nimport android.view.animation.DecelerateInterpolator\nimport android.webkit.WebChromeClient\nimport android.webkit.WebSettings\nimport android.webkit.WebView\nimport android.webkit.WebViewClient\nimport android.widget.*\nimport androidx.appcompat.app.AlertDialog\nimport androidx.appcompat.app.AppCompatActivity\nimport androidx.core.app.ActivityCompat\nimport androidx.core.content.ContextCompat\nimport androidx.core.graphics.ColorUtils\nimport androidx.recyclerview.widget.LinearLayoutManager\nimport androidx.recyclerview.widget.RecyclerView\nimport org.json.JSONObject\nimport java.io.File\nimport java.io.FileOutputStream\nimport java.net.HttpURLConnection\nimport java.net.URL\nimport java.text.SimpleDateFormat\nimport java.util.*\nimport kotlin.concurrent.thread\n\ndata class AppEntry(\n    val label: String,\n    val packageName: String,\n    val icon: Drawable,\n    val banner: Drawable?,\n    val brandColor: Int,\n    val cardBitmap: Bitmap\n)\n\nclass MainActivity : AppCompatActivity() {\n\n    private lateinit var prefs: SharedPreferences\n    private var allApps = mutableListOf<AppEntry>()\n\n    private var movingPackage: String? = null\n    private val mainHandler = Handler(Looper.getMainLooper())\n\n    private var lastAccent = Color.parseColor(\"#1D3557\")\n    private var customWallpaperActive = false\n\n    private val gradientPresets: List<Pair<String, IntArray?>> = listOf(\n        \"Динамический (цвет приложения)\" to null,\n        \"Полночь\" to intArrayOf(Color.parseColor(\"#14213D\"), Color.parseColor(\"#080D1A\"), Color.parseColor(\"#020408\")),\n        \"Северное сияние\" to intArrayOf(Color.parseColor(\"#0F4C5C\"), Color.parseColor(\"#1B2A49\"), Color.parseColor(\"#07090F\")),\n        \"Закат\" to intArrayOf(Color.parseColor(\"#5B2A86\"), Color.parseColor(\"#2B1B4F\"), Color.parseColor(\"#0A0714\")),\n        \"Графит\" to intArrayOf(Color.parseColor(\"#3A3F4B\"), Color.parseColor(\"#1C1F27\"), Color.parseColor(\"#0A0B0E\"))\n    )\n\n    companion object {\n        private const val REQ_PICK_WALLPAPER_IMAGE = 9001\n        private const val REQ_STORAGE_PERMISSION = 9002\n        private const val AIRPLAY_TARGET = \"action:airplay\"\n    }\n\n    private fun dlg(): AlertDialog.Builder = AlertDialog.Builder(this, R.style.AppleDialog)\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\n        prefs = getSharedPreferences(\"apple_tv_vibetv_v7_prefs\", Context.MODE_PRIVATE)\n\n        setupTopHeader()\n        applyWallpaper()\n        refreshApps()\n        startStatusAndWeatherUpdates()\n    }\n\n    override fun onDestroy() {\n        mainHandler.removeCallbacksAndMessages(null)\n        super.onDestroy()\n    }\n\n    // =========================================================================\n    // ВЕРХНЯЯ ПАНЕЛЬ\n    // =========================================================================\n    private fun setupTopHeader() {\n        updateGreetingAndDate()\n\n        findViewById<View>(R.id.btnSources).apply {\n            setupTopButtonFocus(this)\n            setOnClickListener { openInputs() }\n        }\n\n        findViewById<View>(R.id.btnWifiStatus).apply {\n            setupTopButtonFocus(this)\n            setOnClickListener { launchVpnOrSettings() }\n            setOnLongClickListener {\n                try { startActivity(Intent(Settings.ACTION_WIFI_SETTINGS)) } catch (_: Exception) {}\n                true\n            }\n        }\n\n        findViewById<View>(R.id.btnSettings).apply {\n            setupTopButtonFocus(this)\n            setOnClickListener { showAppleTvSettingsDialog() }\n        }\n\n        applyTopButtonsVisibility()\n    }\n\n    private fun applyTopButtonsVisibility() {\n        findViewById<View>(R.id.btnSources).visibility =\n            if (prefs.getBoolean(\"hide_btn_sources\", false)) View.GONE else View.VISIBLE\n        findViewById<View>(R.id.btnWifiStatus).visibility =\n            if (prefs.getBoolean(\"hide_btn_wifi\", false)) View.GONE else View.VISIBLE\n    }\n\n    private fun showTopButtonsDialog() {\n        val names = arrayOf(\"Источники\", \"Wi-Fi / VPN\")\n        val keys = arrayOf(\"hide_btn_sources\", \"hide_btn_wifi\")\n        val checked = BooleanArray(keys.size) { !prefs.getBoolean(keys[it], false) }\n        dlg()\n            .setTitle(\"Какие кнопки показывать сверху\")\n            .setMultiChoiceItems(names, checked) { _, which, isChecked -> checked[which] = isChecked }\n            .setPositiveButton(\"Применить\") { _, _ ->\n                val e = prefs.edit()\n                for (i in keys.indices) e.putBoolean(keys[i], !checked[i])\n                e.apply()\n                applyTopButtonsVisibility()\n            }\n            .setNegativeButton(\"Отмена\", null)\n            .show()\n    }\n\n    private fun setupTopButtonFocus(view: View) {\n        view.setOnFocusChangeListener { v, hasFocus ->\n            v.animate()\n                .scaleX(if (hasFocus) 1.12f else 1.0f)\n                .scaleY(if (hasFocus) 1.12f else 1.0f)\n                .setDuration(160)\n                .start()\n        }\n    }\n\n    private fun updateGreetingAndDate() {\n        val cal = Calendar.getInstance()\n        val hour = cal.get(Calendar.HOUR_OF_DAY)\n        val greeting = when (hour) {\n            in 5..11 -> \"ДОБРОЕ УТРО\"\n            in 12..17 -> \"ДОБРЫЙ ДЕНЬ\"\n            in 18..22 -> \"ДОБРЫЙ ВЕЧЕР\"\n            else -> \"ДОБРОЙ НОЧИ\"\n        }\n        findViewById<TextView>(R.id.tvGreeting).text = greeting\n\n        val locale = Locale(\"ru\")\n        val dayOfWeek = SimpleDateFormat(\"EEEE\", locale).format(cal.time).uppercase(locale)\n        val dayAndMonth = SimpleDateFormat(\"d MMMM\", locale).format(cal.time).uppercase(locale)\n        findViewById<TextView>(R.id.tvDateTwoLine).text = \"$dayOfWeek\\n$dayAndMonth\"\n    }\n\n    private fun openInputs() {\n        try {\n            startActivity(Intent(\"com.android.tv.action.VIEW_INPUTS\"))\n        } catch (_: Exception) {\n            try { startActivity(Intent(Settings.ACTION_SETTINGS)) } catch (_: Exception) {}\n        }\n    }\n\n    // =========================================================================\n    // ОБОИ (фото из памяти ТВ или градиенты)\n    // =========================================================================\n    private fun showPhotoWallpaperPickerDialog() {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {\n            val perm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_IMAGES else Manifest.permission.READ_EXTERNAL_STORAGE\n            if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {\n                ActivityCompat.requestPermissions(this, arrayOf(perm), REQ_STORAGE_PERMISSION)\n            }\n        }\n\n        val options = arrayOf(\n            \"📂 Выбрать фото через проводник / галерею\",\n            \"🔍 Найти фото в папках Download и Pictures\",\n            \"🎨 Градиентные фоны\"\n        )\n\n        dlg()\n            .setTitle(\"🖼 Обои главного экрана\")\n            .setItems(options) { _, which ->\n                when (which) {\n                    0 -> openSystemFilePickerForWallpaper()\n                    1 -> scanDeviceFoldersForImages()\n                    2 -> showGradientWallpaperDialog()\n                }\n            }\n            .show()\n    }\n\n    private fun showGradientWallpaperDialog() {\n        val names = gradientPresets.map { it.first }.toTypedArray()\n        dlg()\n            .setTitle(\"🎨 Градиентные фоны\")\n            .setItems(names) { _, idx ->\n                prefs.edit().remove(\"custom_wallpaper_path\").putInt(\"wallpaper_mode\", idx).apply()\n                applyWallpaper()\n            }\n            .show()\n    }\n\n    private fun openSystemFilePickerForWallpaper() {\n        try {\n            val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {\n                addCategory(Intent.CATEGORY_OPENABLE)\n                type = \"image/*\"\n            }\n            startActivityForResult(intent, REQ_PICK_WALLPAPER_IMAGE)\n        } catch (_: Exception) {\n            try {\n                val fallback = Intent(Intent.ACTION_GET_CONTENT).apply { type = \"image/*\" }\n                startActivityForResult(fallback, REQ_PICK_WALLPAPER_IMAGE)\n            } catch (_: Exception) {\n                scanDeviceFoldersForImages()\n            }\n        }\n    }\n\n    private fun scanDeviceFoldersForImages() {\n        val foundFiles = mutableListOf<File>()\n        val dirsToScan = listOf(\n            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),\n            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES),\n            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM),\n            File(\"/sdcard/Download\"),\n            File(\"/sdcard/Pictures\"),\n            File(\"/storage/emulated/0/Download\"),\n            File(\"/storage/emulated/0/Pictures\")\n        )\n\n        val extensions = listOf(\".jpg\", \".jpeg\", \".png\", \".webp\")\n        for (dir in dirsToScan) {\n            if (dir != null && dir.exists() && dir.isDirectory) {\n                dir.listFiles()?.forEach { file ->\n                    if (file.isFile && extensions.any { file.name.lowercase().endsWith(it) }) {\n                        if (foundFiles.none { it.absolutePath == file.absolutePath }) {\n                            foundFiles.add(file)\n                        }\n                    }\n                }\n            }\n        }\n\n        if (foundFiles.isEmpty()) {\n            dlg()\n                .setTitle(\"Фото не найдены\")\n                .setMessage(\"Скиньте картинку (.jpg или .png) на телевизор в папку Download или Pictures, и она сразу появится здесь.\")\n                .setPositiveButton(\"Понятно\", null)\n                .show()\n            return\n        }\n\n        val names = foundFiles.map { \"🖼 ${it.name} (${it.length() / 1024} КБ)\" }.toTypedArray()\n        dlg()\n            .setTitle(\"Выберите фото из памяти ТВ\")\n            .setItems(names) { _, idx -> applyImageFileAsWallpaper(foundFiles[idx]) }\n            .show()\n    }\n\n    private fun applyImageFileAsWallpaper(sourceFile: File) {\n        try {\n            val destFile = File(filesDir, \"custom_wallpaper.jpg\")\n            sourceFile.inputStream().use { input ->\n                FileOutputStream(destFile).use { output -> input.copyTo(output) }\n            }\n            prefs.edit().putString(\"custom_wallpaper_path\", destFile.absolutePath).apply()\n            applyWallpaper()\n            Toast.makeText(this, \"Фото-обои установлены\", Toast.LENGTH_SHORT).show()\n        } catch (e: Exception) {\n            Toast.makeText(this, \"Ошибка чтения файла: ${e.message}\", Toast.LENGTH_LONG).show()\n        }\n    }\n\n    override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {\n        super.onActivityResult(requestCode, resultCode, data)\n        if (requestCode == REQ_PICK_WALLPAPER_IMAGE && resultCode == Activity.RESULT_OK) {\n            val uri = data?.data ?: return\n            try {\n                val destFile = File(filesDir, \"custom_wallpaper.jpg\")\n                contentResolver.openInputStream(uri)?.use { input ->\n                    FileOutputStream(destFile).use { output -> input.copyTo(output) }\n                }\n                prefs.edit().putString(\"custom_wallpaper_path\", destFile.absolutePath).apply()\n                applyWallpaper()\n                Toast.makeText(this, \"Фото-обои установлены\", Toast.LENGTH_SHORT).show()\n            } catch (e: Exception) {\n                Toast.makeText(this, \"Не удалось загрузить фото\", Toast.LENGTH_SHORT).show()\n            }\n        }\n    }\n\n    private fun decodeSampled(path: String, reqW: Int, reqH: Int): Bitmap? {\n        return try {\n            val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }\n            BitmapFactory.decodeFile(path, bounds)\n            var sample = 1\n            while (bounds.outWidth / (sample * 2) >= reqW && bounds.outHeight / (sample * 2) >= reqH) sample *= 2\n            val opts = BitmapFactory.Options().apply { inSampleSize = sample }\n            BitmapFactory.decodeFile(path, opts)\n        } catch (_: Throwable) {\n            null\n        }\n    }\n\n    // Полная перерисовка фона: вызывается при старте и после смены обоев\n    private fun applyWallpaper() {\n        val imageView = findViewById<ImageView>(R.id.customWallpaperImage)\n        val ambientView = findViewById<View>(R.id.ambientGlowView)\n        val customPath = prefs.getString(\"custom_wallpaper_path\", null)\n\n        if (!customPath.isNullOrBlank() && File(customPath).exists()) {\n            val bmp = decodeSampled(customPath, 1920, 1080)\n            if (bmp != null) {\n                imageView.setImageBitmap(bmp)\n                imageView.visibility = View.VISIBLE\n                ambientView.background = GradientDrawable(\n                    GradientDrawable.Orientation.TOP_BOTTOM,\n                    intArrayOf(Color.parseColor(\"#66000000\"), Color.parseColor(\"#11000000\"), Color.parseColor(\"#88000000\"))\n                )\n                customWallpaperActive = true\n                return\n            }\n        }\n\n        customWallpaperActive = false\n        imageView.setImageDrawable(null)\n        imageView.visibility = View.GONE\n        applyGradientBackground(lastAccent)\n    }\n\n    private fun applyGradientBackground(accent: Int) {\n        val mode = prefs.getInt(\"wallpaper_mode\", 0).coerceIn(0, gradientPresets.size - 1)\n        val preset = gradientPresets[mode].second\n        val colors = preset ?: run {\n            val glow = if (ColorUtils.calculateLuminance(accent) > 0.6) Color.parseColor(\"#1E3A5F\") else manipulateColor(accent, 0.55f)\n            intArrayOf(glow, Color.parseColor(\"#0B132B\"), Color.parseColor(\"#05070F\"))\n        }\n        findViewById<View>(R.id.ambientGlowView).background =\n            GradientDrawable(GradientDrawable.Orientation.TL_BR, colors)\n    }\n\n    // Лёгкое обновление при смене фокуса: фото не перечитывается с диска\n    private fun onAppFocused(color: Int) {\n        lastAccent = color\n        if (!customWallpaperActive && prefs.getInt(\"wallpaper_mode\", 0) == 0) {\n            applyGradientBackground(color)\n        }\n    }\n\n    // =========================================================================\n    // ПЕРЕНАЗНАЧЕНИЕ КНОПОК ПУЛЬТА\n    // =========================================================================\n    private fun remapPrefKey(keyCode: Int, scanCode: Int): String =\n        if (keyCode == KeyEvent.KEYCODE_UNKNOWN) \"remap_scan_$scanCode\" else \"remap_key_$keyCode\"\n\n    private fun showMultiButtonRemapManagerDialog() {\n        val mappedLabels = mutableListOf<String>()\n        val mappedPrefKeys = mutableListOf<String>()\n\n        for ((k, v) in prefs.all) {\n            if ((k.startsWith(\"remap_key_\") || k.startsWith(\"remap_scan_\")) && v is String) {\n                val code = k.substringAfterLast(\"_\")\n                val kind = if (k.startsWith(\"remap_scan_\")) \"скан-код\" else \"код\"\n                mappedLabels.add(\"🔘 Кнопка ($kind $code)  ➔  ${resolveTargetLabel(v)}\")\n                mappedPrefKeys.add(k)\n            }\n        }\n\n        val menuItems = mutableListOf(\"➕ Привязать новую кнопку пульта...\")\n        menuItems.addAll(mappedLabels)\n        if (mappedPrefKeys.isNotEmpty()) {\n            menuItems.add(\"🗑 Очистить все привязки\")\n        }\n\n        dlg()\n            .setTitle(\"🎮 Кнопки пульта (Okko, Иви, Смотрим, VK, Rutube)\")\n            .setItems(menuItems.toTypedArray()) { _, which ->\n                when {\n                    which == 0 -> showSelectAppToBindButtonDialog()\n                    mappedPrefKeys.isNotEmpty() && which == menuItems.size - 1 -> {\n                        val editor = prefs.edit()\n                        for (k in mappedPrefKeys) editor.remove(k)\n                        editor.apply()\n                        Toast.makeText(this, \"Все привязки сброшены\", Toast.LENGTH_SHORT).show()\n                    }\n                    else -> {\n                        prefs.edit().remove(mappedPrefKeys[which - 1]).apply()\n                        Toast.makeText(this, \"Привязка удалена\", Toast.LENGTH_SHORT).show()\n                    }\n                }\n            }\n            .show()\n    }\n\n    private fun showSelectAppToBindButtonDialog() {\n        val labels = mutableListOf(\n            \"🛡 Включить VPN\",\n            \"✨ ИИ-помощник (Gemini / ChatGPT)\",\n            \"📡 AirPlay\"\n        )\n        val values = mutableListOf(\"action:vpn\", \"action:ai\", AIRPLAY_TARGET)\n\n        for (app in allApps) {\n            if (app.packageName.startsWith(\"action:\")) continue\n            labels.add(\"📱 ${app.label}\")\n            values.add(app.packageName)\n        }\n\n        dlg()\n            .setTitle(\"Шаг 1: что открывать по кнопке\")\n            .setItems(labels.toTypedArray()) { _, idx ->\n                startInteractiveButtonCapture(values[idx], labels[idx])\n            }\n            .show()\n    }\n\n    private fun startInteractiveButtonCapture(targetValue: String, targetLabel: String) {\n        val ignored = setOf(\n            KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN,\n            KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT,\n            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_BACK,\n            KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN, KeyEvent.KEYCODE_VOLUME_MUTE\n        )\n        dlg()\n            .setTitle(\"Шаг 2: нажмите кнопку на пульте\")\n            .setMessage(\"Нажмите нужную кнопку («Смотрим», «Okko», «Иви», «VK Видео», «Rutube», «ТВ» или «Салют»), чтобы назначить на неё:\\n\\n$targetLabel\")\n            .setNegativeButton(\"Отмена\", null)\n            .setOnKeyListener { dialog, keyCode, event ->\n                if (event.action == KeyEvent.ACTION_DOWN &&\n                    keyCode !in ignored &&\n                    !(keyCode == KeyEvent.KEYCODE_UNKNOWN && event.scanCode == 0)\n                ) {\n                    prefs.edit().putString(remapPrefKey(keyCode, event.scanCode), targetValue).apply()\n                    dialog.dismiss()\n                    val codeText = if (keyCode == KeyEvent.KEYCODE_UNKNOWN) \"скан-код ${event.scanCode}\" else \"код $keyCode\"\n                    Toast.makeText(\n                        this@MainActivity,\n                        \"✅ Кнопка ($codeText) теперь открывает: $targetLabel\",\n                        Toast.LENGTH_LONG\n                    ).show()\n                    true\n                } else {\n                    false\n                }\n            }\n            .show()\n    }\n\n    private fun resolveTargetLabel(target: String): String {\n        if (target == \"action:vpn\") return \"🛡 VPN\"\n        if (target == \"action:ai\") return \"✨ ИИ-помощник\"\n        if (target == AIRPLAY_TARGET) return \"📡 AirPlay\"\n        val found = allApps.firstOrNull { it.packageName == target }\n        return found?.label ?: target\n    }\n\n    override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {\n        val scan = event?.scanCode ?: 0\n        val isUnmappableUnknown = keyCode == KeyEvent.KEYCODE_UNKNOWN && scan == 0\n        if (!isUnmappableUnknown) {\n            val customTarget = prefs.getString(remapPrefKey(keyCode, scan), null)\n            if (customTarget != null) {\n                // Повторы при удержании кнопки не запускают действие снова\n                if ((event?.repeatCount ?: 0) == 0) executeTargetAction(customTarget)\n                return true\n            }\n        }\n\n        if (keyCode == KeyEvent.KEYCODE_SEARCH || keyCode == KeyEvent.KEYCODE_VOICE_ASSIST) {\n            openAi()\n            return true\n        }\n\n        return super.onKeyDown(keyCode, event)\n    }\n\n    private fun executeTargetAction(target: String) {\n        when (target) {\n            \"action:vpn\" -> launchVpnOrSettings()\n            \"action:ai\" -> openAi()\n            AIRPLAY_TARGET -> openAirPlay()\n            else -> launchPackage(target)\n        }\n    }\n\n    // =========================================================================\n    // AIRPLAY: плитка запускает настоящее приложение-приёмник\n    // =========================================================================\n    private fun isInstalled(pkg: String): Boolean =\n        packageManager.getLaunchIntentForPackage(pkg) != null ||\n            packageManager.getLeanbackLaunchIntentForPackage(pkg) != null\n\n    private fun getAllLaunchableApps(): List<Pair<String, String>> {\n        val pm = packageManager\n        val infos = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER), 0) +\n            pm.queryIntentActivities(Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER), 0)\n        return infos\n            .map { it.activityInfo.packageName to it.loadLabel(pm).toString() }\n            .filter { it.first != packageName }\n            .distinctBy { it.first }\n            .sortedBy { it.second.lowercase() }\n    }\n\n    private fun findAirPlayReceiver(): String? {\n        val keys = listOf(\"airscreen\", \"airplay\", \"air receiver\", \"airreceiver\", \"airplayer\", \"letsview\", \"lebo\", \"mirror\")\n        return getAllLaunchableApps().firstOrNull { (pkg, label) ->\n            keys.any { pkg.lowercase().contains(it) || label.lowercase().contains(it) }\n        }?.first\n    }\n\n    private fun openAirPlay() {\n        val saved = prefs.getString(\"airplay_receiver_pkg\", null)\n        val pkg = if (saved != null && isInstalled(saved)) saved else findAirPlayReceiver()\n        if (pkg != null) {\n            launchPackage(pkg)\n        } else {\n            showAirPlayReceiverPicker()\n        }\n    }\n\n    private fun showAirPlayReceiverPicker() {\n        val apps = getAllLaunchableApps()\n        if (apps.isEmpty()) {\n            Toast.makeText(this, \"Приложения не найдены\", Toast.LENGTH_SHORT).show()\n            return\n        }\n        dlg()\n            .setTitle(\"📡 Какое приложение принимает AirPlay?\")\n            .setItems(apps.map { it.second }.toTypedArray()) { _, idx ->\n                prefs.edit().putString(\"airplay_receiver_pkg\", apps[idx].first).apply()\n                launchPackage(apps[idx].first)\n            }\n            .setNegativeButton(\"Отмена\", null)\n            .show()\n    }\n\n    // =========================================================================\n    // СПИСОК ПРИЛОЖЕНИЙ, СКРЫТИЕ И ЕДИНЫЙ ГОРИЗОНТАЛЬНЫЙ РЯД\n    // =========================================================================\n    private fun getHiddenPackages(): MutableSet<String> {\n        return (prefs.getStringSet(\"hidden_packages\", emptySet()) ?: emptySet()).toMutableSet()\n    }\n\n    private fun hidePackage(pkg: String, label: String) {\n        val set = getHiddenPackages()\n        set.add(pkg)\n        prefs.edit().putStringSet(\"hidden_packages\", set).apply()\n        refreshApps()\n        Toast.makeText(this, \"«$label» скрыто. Вернуть можно в настройках ⚙\", Toast.LENGTH_LONG).show()\n    }\n\n    private fun showHiddenPackagesManagerDialog() {\n        val hidden = getHiddenPackages().toList()\n        if (hidden.isEmpty()) {\n            Toast.makeText(this, \"Нет скрытых приложений\", Toast.LENGTH_SHORT).show()\n            return\n        }\n        val pm = packageManager\n        val labels = hidden.map { pkg ->\n            if (pkg == AIRPLAY_TARGET) \"AirPlay\" else try {\n                pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString()\n            } catch (_: Exception) {\n                pkg\n            }\n        }.toTypedArray()\n\n        val checked = BooleanArray(hidden.size) { true }\n\n        dlg()\n            .setTitle(\"👁 Скрытые (снимите галочку, чтобы вернуть)\")\n            .setMultiChoiceItems(labels, checked) { _, which, isChecked -> checked[which] = isChecked }\n            .setPositiveButton(\"Применить\") { _, _ ->\n                val newSet = mutableSetOf<String>()\n                for (i in hidden.indices) {\n                    if (checked[i]) newSet.add(hidden[i])\n                }\n                prefs.edit().putStringSet(\"hidden_packages\", newSet).apply()\n                refreshApps()\n            }\n            .setNegativeButton(\"Вернуть все\") { _, _ ->\n                prefs.edit().remove(\"hidden_packages\").apply()\n                refreshApps()\n            }\n            .show()\n    }\n\n    private fun isJunkSystemApp(pkg: String, label: String, appInfo: ApplicationInfo): Boolean {\n        val p = pkg.lowercase()\n        val l = label.lowercase()\n\n        val whitelist = listOf(\n            \"youtube\", \"kinopoisk\", \"wink\", \"ivi\", \"okko\", \"kion\", \"premier\", \"start\",\n            \"vlc\", \"kodi\", \"plex\", \"num\", \"lampa\", \"torrserve\", \"smarttube\", \"rutube\",\n            \"vkvideo\", \"vk.video\", \"v2ray\", \"nekobox\", \"outline\", \"wireguard\", \"openvpn\",\n            \"adguard\", \"hidemy\", \"windscribe\", \"proton\", \"psiphon\", \"chrome\", \"firefox\",\n            \"opera\", \"sendfiles\", \"cxinventor\", \"plombir\", \"zona\", \"hdrezka\", \"spotify\",\n            \"twitch\", \"netflix\", \"happ\", \"apple\"\n        )\n        if (whitelist.any { p.contains(it) || l.contains(it) }) return false\n\n        val blacklist = listOf(\n            \"parentcontrol\", \"webview\", \"inputmethod\", \"keyboard\", \"bluetooth\",\n            \"packageinstaller\", \"certinstaller\", \"captiveportal\", \"dreams\", \"screensaver\",\n            \"printspooler\", \"statementservice\", \"companion\", \"callout\", \"salute\", \"sber\",\n            \"starlauncher\", \"katniss\", \"leanbacklauncher\", \"tvrecommendations\", \"provision\"\n        )\n        if (blacklist.any { p.contains(it) || l.contains(it) }) return true\n\n        val isSystem = (appInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0\n        val isUpdatedSystem = (appInfo.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0\n        if (isSystem && !isUpdatedSystem) {\n            if (p.startsWith(\"com.android.\") || p.startsWith(\"android.\") || p.startsWith(\"com.google.android.tv\")) {\n                return true\n            }\n        }\n        return false\n    }\n\n    private fun refreshApps() {\n        val pm = packageManager\n        val rawMap = mutableMapOf<String, ResolveInfo>()\n        val hiddenSet = getHiddenPackages()\n\n        val mainIntent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)\n        val tvIntent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)\n\n        for (info in pm.queryIntentActivities(mainIntent, 0) + pm.queryIntentActivities(tvIntent, 0)) {\n            val pkg = info.activityInfo.packageName\n            if (pkg != packageName && !hiddenSet.contains(pkg)) {\n                rawMap[pkg] = info\n            }\n        }\n\n        val filtered = mutableListOf<AppEntry>()\n        for ((pkg, info) in rawMap) {\n            val label = info.loadLabel(pm).toString()\n            val appInfo = info.activityInfo.applicationInfo\n            if (isJunkSystemApp(pkg, label, appInfo)) continue\n\n            val icon = info.loadIcon(pm)\n            val banner = info.activityInfo.loadBanner(pm) ?: appInfo.loadBanner(pm)\n            val brandColor = detectBrandColor(label, pkg, icon)\n            val bmp = renderCardBitmap(label, icon, banner, brandColor)\n            filtered.add(AppEntry(label, pkg, icon, banner, brandColor, bmp))\n        }\n\n        // Встроенная плитка AirPlay: двигается и скрывается как обычное приложение\n        if (!hiddenSet.contains(AIRPLAY_TARGET)) {\n            val airIcon = ContextCompat.getDrawable(this, R.drawable.ic_airplay)\n            if (airIcon != null) {\n                val airColor = Color.parseColor(\"#2C2C34\")\n                filtered.add(AppEntry(\"AirPlay\", AIRPLAY_TARGET, airIcon, null, airColor, renderCardBitmap(\"AirPlay\", airIcon, null, airColor)))\n            }\n        }\n\n        val savedOrder = (prefs.getString(\"saved_app_order\", \"\") ?: \"\")\n            .split(\",\").filter { it.isNotBlank() }\n\n        filtered.sortWith(Comparator { a, b ->\n            val idxA = savedOrder.indexOf(a.packageName)\n            val idxB = savedOrder.indexOf(b.packageName)\n            when {\n                idxA != -1 && idxB != -1 -> idxA.compareTo(idxB)\n                idxA != -1 -> -1\n                idxB != -1 -> 1\n                else -> a.label.compareTo(b.label, ignoreCase = true)\n            }\n        })\n\n        allApps = filtered\n        setupSingleRowDockAdapter()\n    }\n\n    private fun saveCurrentAppOrder() {\n        val combined = allApps.joinToString(\",\") { it.packageName }\n        prefs.edit().putString(\"saved_app_order\", combined).apply()\n    }\n\n    // Цвет фона карточки по иконке: у известных сервисов свой, у остальных берётся из самой иконки\n    private fun iconBaseColor(icon: Drawable): Int {\n        return try {\n            val size = 24\n            val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)\n            val c = Canvas(bmp)\n            icon.setBounds(0, 0, size, size)\n            icon.draw(c)\n            var r = 0L\n            var g = 0L\n            var b = 0L\n            var n = 0\n            for (y in 0 until size) {\n                for (x in 0 until size) {\n                    val p = bmp.getPixel(x, y)\n                    if (Color.alpha(p) > 200) {\n                        r += Color.red(p)\n                        g += Color.green(p)\n                        b += Color.blue(p)\n                        n++\n                    }\n                }\n            }\n            bmp.recycle()\n            if (n == 0) return Color.parseColor(\"#2C2C34\")\n            val opaqueRatio = n.toFloat() / (size * size)\n            val avg = Color.rgb((r / n).toInt(), (g / n).toInt(), (b / n).toInt())\n            if (opaqueRatio < 0.55f) {\n                // значок на прозрачном фоне: выбираем контрастную подложку\n                if (ColorUtils.calculateLuminance(avg) > 0.5) Color.parseColor(\"#2C2C34\") else Color.parseColor(\"#F5F5F7\")\n            } else {\n                avg\n            }\n        } catch (_: Throwable) {\n            Color.parseColor(\"#2C2C34\")\n        }\n    }\n\n    private fun detectBrandColor(label: String, pkg: String, icon: Drawable): Int {\n        val s = \"$label $pkg\".lowercase()\n        return when {\n            s.contains(\"youtube\") || s.contains(\"smarttube\") -> Color.parseColor(\"#F5F5F7\")\n            s.contains(\"netflix\") -> Color.parseColor(\"#F5F5F7\")\n            s.contains(\"okko\") -> Color.parseColor(\"#5E2B97\")\n            s.contains(\"кинопоиск\") || s.contains(\"kinopoisk\") -> Color.parseColor(\"#FF5500\")\n            s.contains(\"twitch\") -> Color.parseColor(\"#6441A5\")\n            s.contains(\"rutube\") -> Color.parseColor(\"#4B2882\")\n            s.contains(\"spotify\") -> Color.parseColor(\"#18181C\")\n            s.contains(\"vk\") -> Color.parseColor(\"#19191D\")\n            s.contains(\"wink\") || s.contains(\"винк\") -> Color.parseColor(\"#FF5C00\")\n            s.contains(\"иви\") || s.contains(\"ivi\") -> Color.parseColor(\"#EA003D\")\n            s.contains(\"happ\") || s.contains(\"v2ray\") || s.contains(\"vpn\") -> Color.parseColor(\"#2B3A4A\")\n            else -> iconBaseColor(icon)\n        }\n    }\n\n    private fun renderCardBitmap(label: String, icon: Drawable, banner: Drawable?, brandColor: Int): Bitmap {\n        val width = 352\n        val height = 198\n        val bmp = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)\n        val canvas = Canvas(bmp)\n\n        if (banner != null) {\n            banner.setBounds(0, 0, width, height)\n            banner.draw(canvas)\n            return bmp\n        }\n\n        val isLightCard = ColorUtils.calculateLuminance(brandColor) > 0.6\n        val c2 = if (isLightCard) Color.parseColor(\"#E5E5EA\") else manipulateColor(brandColor, 0.62f)\n\n        val paint = Paint(Paint.ANTI_ALIAS_FLAG)\n        paint.shader = LinearGradient(0f, 0f, width.toFloat(), height.toFloat(), brandColor, c2, Shader.TileMode.CLAMP)\n        canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)\n\n        val iconSize = 96\n        val left = (width - iconSize) / 2\n        val top = (height - iconSize) / 2 - 16\n        icon.setBounds(left, top, left + iconSize, top + iconSize)\n        icon.draw(canvas)\n\n        val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {\n            color = if (isLightCard) Color.parseColor(\"#111111\") else Color.WHITE\n            textSize = 22f\n            typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)\n            textAlign = Paint.Align.CENTER\n            if (!isLightCard) setShadowLayer(4f, 0f, 2f, Color.BLACK)\n        }\n        val shortLabel = if (label.length > 16) label.take(14) + \"…\" else label\n        canvas.drawText(shortLabel, width / 2f, height - 18f, textPaint)\n\n        return bmp\n    }\n\n    private fun manipulateColor(color: Int, factor: Float): Int {\n        val a = Color.alpha(color)\n        val r = Math.round(Color.red(color) * factor).coerceAtMost(255)\n        val g = Math.round(Color.green(color) * factor).coerceAtMost(255)\n        val b = Math.round(Color.blue(color) * factor).coerceAtMost(255)\n        return Color.argb(a, r, g, b)\n    }\n\n    private fun setupSingleRowDockAdapter() {\n        val dockRv = findViewById<RecyclerView>(R.id.dockRecycler)\n        dockRv.layoutManager = LinearLayoutManager(this, LinearLayoutManager.HORIZONTAL, false)\n        dockRv.adapter = object : RecyclerView.Adapter<RecyclerView.ViewHolder>() {\n            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {\n                val v = layoutInflater.inflate(R.layout.item_app_tile, parent, false)\n                return object : RecyclerView.ViewHolder(v) {}\n            }\n\n            override fun getItemCount() = allApps.size\n\n            override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {\n                val app = allApps[position]\n                val cardView = holder.itemView.findViewById<FrameLayout>(R.id.appCardView)\n                val artwork = holder.itemView.findViewById<ImageView>(R.id.appCardArtwork)\n                val border = holder.itemView.findViewById<View>(R.id.focusBorder)\n                val gloss = holder.itemView.findViewById<View>(R.id.focusGloss)\n                val badge = holder.itemView.findViewById<TextView>(R.id.tvCardBadge)\n                val nameTv = holder.itemView.findViewById<TextView>(R.id.tvTileName)\n\n                cardView.outlineProvider = ViewOutlineProvider.BACKGROUND\n                cardView.clipToOutline = true\n                artwork.setImageBitmap(app.cardBitmap)\n                nameTv.text = app.label\n\n                // сброс состояния переиспользованной плитки\n                cardView.scaleX = 1f\n                cardView.scaleY = 1f\n                cardView.translationY = 0f\n                cardView.translationZ = 0f\n                border.alpha = 0f\n                gloss.alpha = 0f\n                nameTv.alpha = 0f\n                nameTv.translationY = -6f\n\n                badge.visibility = if (movingPackage == app.packageName) View.VISIBLE else View.GONE\n\n                cardView.setOnFocusChangeListener { v, hasFocus ->\n                    if (hasFocus) {\n                        onAppFocused(app.brandColor)\n                        v.animate()\n                            .scaleX(1.12f)\n                            .scaleY(1.12f)\n                            .translationY(-8f)\n                            .translationZ(30f)\n                            .setInterpolator(DecelerateInterpolator(1.6f))\n                            .setDuration(220)\n                            .start()\n                        border.animate().alpha(1f).setDuration(160).start()\n                        gloss.animate().alpha(1f).setDuration(220).start()\n                        nameTv.animate().alpha(1f).translationY(0f).setDuration(200).start()\n                    } else {\n                        v.animate()\n                            .scaleX(1.0f)\n                            .scaleY(1.0f)\n                            .translationY(0f)\n                            .translationZ(0f)\n                            .setDuration(170)\n                            .start()\n                        border.animate().alpha(0f).setDuration(140).start()\n                        gloss.animate().alpha(0f).setDuration(140).start()\n                        nameTv.animate().alpha(0f).translationY(-6f).setDuration(140).start()\n                    }\n                }\n\n                cardView.setOnClickListener {\n                    if (movingPackage != null) {\n                        movingPackage = null\n                        badge.visibility = View.GONE\n                        saveCurrentAppOrder()\n                        Toast.makeText(this@MainActivity, \"Позиция «${app.label}» сохранена\", Toast.LENGTH_SHORT).show()\n                    } else {\n                        executeTargetAction(app.packageName)\n                    }\n                }\n\n                cardView.setOnLongClickListener {\n                    val isVirtual = app.packageName.startsWith(\"action:\")\n                    val options = arrayOf(\n                        \"🎮 Привязать «${app.label}» к кнопке пульта\",\n                        \"↔️ Переместить (стрелками ◄ ►)\",\n                        \"👁 Скрыть с главного экрана\",\n                        \"▶️ Открыть\",\n                        if (isVirtual) \"📡 Выбрать приложение-приёмник AirPlay\" else \"ℹ️ Информация о приложении\"\n                    )\n                    dlg()\n                        .setTitle(app.label)\n                        .setItems(options) { _, which ->\n                            when (which) {\n                                0 -> startInteractiveButtonCapture(app.packageName, app.label)\n                                1 -> {\n                                    movingPackage = app.packageName\n                                    badge.visibility = View.VISIBLE\n                                    Toast.makeText(this@MainActivity, \"Двигайте «${app.label}» стрелками ◄ ► и нажмите OK\", Toast.LENGTH_SHORT).show()\n                                }\n                                2 -> hidePackage(app.packageName, app.label)\n                                3 -> executeTargetAction(app.packageName)\n                                4 -> {\n                                    if (isVirtual) {\n                                        showAirPlayReceiverPicker()\n                                    } else {\n                                        try {\n                                            val i = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)\n                                            i.data = Uri.parse(\"package:${app.packageName}\")\n                                            startActivity(i)\n                                        } catch (_: Exception) {}\n                                    }\n                                }\n                            }\n                        }\n                        .show()\n                    true\n                }\n\n                cardView.setOnKeyListener { _, keyCode, event ->\n                    if (movingPackage == app.packageName && event.action == KeyEvent.ACTION_DOWN) {\n                        val currentPos = holder.bindingAdapterPosition\n                        if (currentPos == RecyclerView.NO_POSITION) return@setOnKeyListener false\n\n                        when (keyCode) {\n                            KeyEvent.KEYCODE_DPAD_LEFT -> {\n                                if (currentPos > 0) {\n                                    Collections.swap(allApps, currentPos, currentPos - 1)\n                                    notifyItemMoved(currentPos, currentPos - 1)\n                                    saveCurrentAppOrder()\n                                }\n                                return@setOnKeyListener true\n                            }\n                            KeyEvent.KEYCODE_DPAD_RIGHT -> {\n                                if (currentPos < allApps.size - 1) {\n                                    Collections.swap(allApps, currentPos, currentPos + 1)\n                                    notifyItemMoved(currentPos, currentPos + 1)\n                                    saveCurrentAppOrder()\n                                }\n                                return@setOnKeyListener true\n                            }\n                        }\n                    }\n                    false\n                }\n            }\n        }\n    }\n\n    // =========================================================================\n    // СТАТУС СЕТИ, ПОГОДА\n    // =========================================================================\n    private fun startStatusAndWeatherUpdates() {\n        updateNetworkAndVpnStatus()\n        fetchLiveWeather()\n\n        mainHandler.postDelayed(object : Runnable {\n            override fun run() {\n                updateGreetingAndDate()\n                updateNetworkAndVpnStatus()\n                mainHandler.postDelayed(this, 6000)\n            }\n        }, 6000)\n    }\n\n    private fun updateNetworkAndVpnStatus() {\n        val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager\n        val vpnDot = findViewById<View>(R.id.vpnActiveDot)\n\n        var isVpn = false\n        for (net in cm.allNetworks) {\n            val c = cm.getNetworkCapabilities(net)\n            if (c != null && c.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) {\n                isVpn = true\n            }\n        }\n        vpnDot.visibility = if (isVpn) View.VISIBLE else View.GONE\n    }\n\n    private fun fetchLiveWeather() {\n        thread {\n            try {\n                val url = URL(\"https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.61&current_weather=true\")\n                val conn = url.openConnection() as HttpURLConnection\n                conn.connectTimeout = 5000\n                conn.readTimeout = 5000\n                val text = conn.inputStream.bufferedReader().readText()\n                val current = JSONObject(text).getJSONObject(\"current_weather\")\n                val temp = Math.round(current.getDouble(\"temperature\"))\n                val sign = if (temp > 0) \"+$temp\" else \"$temp\"\n                mainHandler.post {\n                    findViewById<TextView>(R.id.tvWeather).text = \"⛅ ${sign}°C\"\n                }\n            } catch (_: Exception) {}\n        }\n    }\n\n    // =========================================================================\n    // ИИ-ПОМОЩНИК (вместо «Салюта»): установленное приложение или встроенный браузер\n    // =========================================================================\n    private fun openAi() {\n        val saved = prefs.getString(\"ai_app_pkg\", null)\n        if (saved != null && isInstalled(saved)) {\n            launchPackage(saved)\n            return\n        }\n        val known = listOf(\"com.google.android.apps.bard\", \"com.openai.chatgpt\", \"com.microsoft.copilot\")\n        val found = known.firstOrNull { isInstalled(it) }\n        if (found != null) launchPackage(found) else openBuiltInAiWebView()\n    }\n\n    private fun showAiAppPicker() {\n        val apps = getAllLaunchableApps()\n        val labels = mutableListOf(\"🌐 Встроенный браузер (Gemini / ChatGPT)\")\n        labels.addAll(apps.map { it.second })\n        dlg()\n            .setTitle(\"✨ Чем открывать ИИ-помощника\")\n            .setItems(labels.toTypedArray()) { _, idx ->\n                if (idx == 0) {\n                    prefs.edit().remove(\"ai_app_pkg\").apply()\n                    openBuiltInAiWebView()\n                } else {\n                    prefs.edit().putString(\"ai_app_pkg\", apps[idx - 1].first).apply()\n                    launchPackage(apps[idx - 1].first)\n                }\n            }\n            .setNegativeButton(\"Отмена\", null)\n            .show()\n    }\n\n    private fun openBuiltInAiWebView() {\n        val dialog = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)\n        val container = LinearLayout(this).apply {\n            orientation = LinearLayout.VERTICAL\n            setBackgroundColor(Color.parseColor(\"#0B0D14\"))\n        }\n        val topBar = LinearLayout(this).apply {\n            orientation = LinearLayout.HORIZONTAL\n            gravity = Gravity.CENTER_VERTICAL\n            setPadding(36, 20, 36, 20)\n            setBackgroundColor(Color.parseColor(\"#161924\"))\n        }\n        val title = TextView(this).apply {\n            text = \"✨ Gemini / ChatGPT\"\n            setTextColor(Color.WHITE)\n            textSize = 16f\n        }\n        val webView = WebView(this)\n        val btnGemini = Button(this).apply {\n            text = \"Gemini\"\n            setOnClickListener {\n                prefs.edit().putString(\"ai_default_url\", \"https://gemini.google.com\").apply()\n                webView.loadUrl(\"https://gemini.google.com\")\n            }\n        }\n        val btnChatGpt = Button(this).apply {\n            text = \"ChatGPT\"\n            setOnClickListener {\n                prefs.edit().putString(\"ai_default_url\", \"https://chatgpt.com\").apply()\n                webView.loadUrl(\"https://chatgpt.com\")\n            }\n        }\n        val btnClose = Button(this).apply {\n            text = \"Закрыть ✕\"\n            setOnClickListener { dialog.dismiss() }\n        }\n        topBar.addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))\n        topBar.addView(btnGemini)\n        topBar.addView(btnChatGpt)\n        topBar.addView(btnClose)\n\n        webView.settings.apply {\n            javaScriptEnabled = true\n            domStorageEnabled = true\n            cacheMode = WebSettings.LOAD_DEFAULT\n        }\n        webView.webViewClient = WebViewClient()\n        webView.webChromeClient = WebChromeClient()\n        webView.loadUrl(prefs.getString(\"ai_default_url\", \"https://chatgpt.com\") ?: \"https://chatgpt.com\")\n\n        container.addView(topBar)\n        container.addView(webView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))\n        dialog.setContentView(container)\n        dialog.show()\n    }\n\n    // =========================================================================\n    // VPN, ЗАПУСК ПРИЛОЖЕНИЙ, НАСТРОЙКИ\n    // =========================================================================\n    private fun launchVpnOrSettings() {\n        val vpnKeywords = listOf(\"happ\", \"vpn\", \"v2ray\", \"nekobox\", \"outline\", \"wireguard\", \"openvpn\", \"adguard\", \"windscribe\", \"proton\", \"hidemy\")\n        val vpnApp = allApps.firstOrNull { app ->\n            !app.packageName.startsWith(\"action:\") &&\n                vpnKeywords.any { kw -> app.label.lowercase().contains(kw) || app.packageName.lowercase().contains(kw) }\n        }\n        if (vpnApp != null) {\n            Toast.makeText(this, \"🛡 Запуск VPN: ${vpnApp.label}\", Toast.LENGTH_SHORT).show()\n            launchPackage(vpnApp.packageName)\n        } else {\n            try {\n                startActivity(Intent(Settings.ACTION_VPN_SETTINGS))\n            } catch (_: Exception) {\n                try { startActivity(Intent(Settings.ACTION_SETTINGS)) } catch (_: Exception) {}\n            }\n        }\n    }\n\n    private fun launchPackage(pkg: String) {\n        val intent = packageManager.getLaunchIntentForPackage(pkg)\n            ?: packageManager.getLeanbackLaunchIntentForPackage(pkg)\n        if (intent != null) {\n            try {\n                startActivity(intent)\n            } catch (_: Exception) {\n                Toast.makeText(this, \"Не удалось открыть приложение\", Toast.LENGTH_SHORT).show()\n            }\n        } else {\n            Toast.makeText(this, \"Приложение не найдено\", Toast.LENGTH_SHORT).show()\n        }\n    }\n\n    private fun showAppleTvSettingsDialog() {\n        val hiddenCount = getHiddenPackages().size\n        val items = arrayOf(\n            \"🖼 Обои (свои фото и градиенты)\",\n            \"🎮 Кнопки пульта (Okko, Иви, Смотрим, VK, Rutube, Салют)\",\n            \"📡 Приложение-приёмник AirPlay\",\n            \"👁 Скрытые приложения (скрыто: $hiddenCount)\",\n            \"✨ ИИ-помощник (Gemini / ChatGPT)\",\n            \"🔘 Кнопки в верхней панели\",\n            \"🔄 Сбросить порядок иконок\",\n            \"⚙️ Системные настройки Android TV\"\n        )\n\n        dlg()\n            .setTitle(\"Настройки Apple TV v8.0\")\n            .setItems(items) { _, which ->\n                when (which) {\n                    0 -> showPhotoWallpaperPickerDialog()\n                    1 -> showMultiButtonRemapManagerDialog()\n                    2 -> showAirPlayReceiverPicker()\n                    3 -> showHiddenPackagesManagerDialog()\n                    4 -> showAiAppPicker()\n                    5 -> showTopButtonsDialog()\n                    6 -> {\n                        prefs.edit().remove(\"saved_app_order\").apply()\n                        refreshApps()\n                        Toast.makeText(this, \"Порядок иконок сброшен\", Toast.LENGTH_SHORT).show()\n                    }\n                    7 -> startActivity(Intent(Settings.ACTION_SETTINGS))\n                }\n            }\n            .show()\n    }\n}\nEOF\n"},{"name":"Compile Debug APK","run":"gradle assembleDebug --no-daemon"},{"name":"Upload Finished APK","uses":"actions/upload-artifact@v4","with":{"name":"AppleTV-Launcher-v8.0","path":"app/build/outputs/apk/debug/app-debug.apk"}}]}},"on":{"push":{"branches":["main","master"]},"workflow_dispatch":null}}
