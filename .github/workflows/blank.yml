                          android:textSize="17sp" />
                  </LinearLayout>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/focusedTitleBlock"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="56dp"
                  android:layout_marginEnd="56dp"
