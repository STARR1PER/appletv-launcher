name: Build Apple tvOS Launcher v8.0

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build-tvos-launcher:
runs-on: ubuntu-latest

steps:
- name: Checkout Repository
uses: actions/checkout@v4

- name: Set up Zulu JDK 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'

- name: Setup Gradle 8.2
uses: gradle/actions/setup-gradle@v3
with:
gradle-version: '8.2'

- name: Create Project Files
run: |
mkdir -p app app/src/main app/src/main/java/com/appletv/launcher app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values

cat << 'EOF' > settings.gradle
pluginManagement {
repositories {
google()
mavenCentral()
gradlePluginPortal()
}
}
dependencyResolutionManagement {
repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
repositories {
google()
mavenCentral()
}
}
rootProject.name = "AppleTvLauncher"
include ':app'
EOF

cat << 'EOF' > gradle.properties
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
EOF

cat << 'EOF' > build.gradle
buildscript {
repositories {
google()
mavenCentral()
}
dependencies {
classpath 'com.android.tools.build:gradle:8.1.0'
classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
}
}
EOF

cat << 'EOF' > app/build.gradle
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
namespace 'com.appletv.launcher'
compileSdk 34
defaultConfig {
applicationId "com.appletv.launcher"
minSdk 24
targetSdk 33
versionCode 36
versionName "8.0.0-AppleStyle"
}
buildTypes {
release { minifyEnabled false }
}
compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}
kotlinOptions { jvmTarget = '17' }
}
dependencies {
implementation 'androidx.core:core-ktx:1.12.0'
implementation 'androidx.appcompat:appcompat:1.6.1'
implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
EOF

cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
<uses-permission android:name="android.permission.INTERNET" />
<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
