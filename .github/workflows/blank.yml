private fun remapPrefKey(keyCode: Int, scanCode: Int): String =
if (keyCode == KeyEvent.KEYCODE_UNKNOWN) "remap_scan_$scanCode" else "remap_key_$keyCode"

private fun showMultiButtonRemapManagerDialog() {
val mappedLabels = mutableListOf<String>()
val mappedPrefKeys = mutableListOf<String>()

for ((k, v) in prefs.all) {
if ((k.startsWith("remap_key_") || k.startsWith("remap_scan_")) && v is String) {
val code = k.substringAfterLast("_")
val kind = if (k.startsWith("remap_scan_")) "скан-код" else "код"
mappedLabels.add("🔘 Кнопка ($kind $code) ➔ ${resolveTargetLabel(v)}")
mappedPrefKeys.add(k)
}
}

val menuItems = mutableListOf("➕ Привязать новую кнопку пульта...")
menuItems.addAll(mappedLabels)
if (mappedPrefKeys.isNotEmpty()) {
menuItems.add("🗑 Очистить все привязки")
}

dlg()
.setTitle("🎮 Кнопки пульта (Okko, Иви, Смотрим, VK, Rutube)")
.setItems(menuItems.toTypedArray()) { _, which ->
when {
which == 0 -> showSelectAppToBindButtonDialog()
mappedPrefKeys.isNotEmpty() && which == menuItems.size - 1 -> {
val editor = prefs.edit()
for (k in mappedPrefKeys) editor.remove(k)
editor.apply()
Toast.makeText(this, "Все привязки сброшены", Toast.LENGTH_SHORT).show()
}
else -> {
prefs.edit().remove(mappedPrefKeys[which - 1]).apply()
Toast.makeText(this, "Привязка удалена", Toast.LENGTH_SHORT).show()
}
}
}
.show()
}

