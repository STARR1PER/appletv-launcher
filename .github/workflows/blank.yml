          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/appletv/launcher/MainActivity.kt
          package com.appletv.launcher

          import android.animation.ArgbEvaluator
          import android.animation.ValueAnimator
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.util.Calendar

          class MainActivity : AppCompatActivity() {

              private val vpnKeywords = listOf("happ", "v2ray", "outline", "wireguard", "vpn", "nekobox", "singbox", "clash", "vless")
              private val airPlayKeywords = listOf("airscreen", "mhshare", "acbridge", "airplay", "airpin", "miracast", "cast", "wfd")

              private lateinit var allApps: MutableList<AppEntry>
              private var currentAmbientColor: Int = Color.parseColor("#1B2438")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  updateGreetingAndDate()
                  setupTopButtons()
                  refreshLauncherGrid()
                  wakeUpAirPlayServicesSilently()
              }

              override fun onResume() {
                  super.onResume()
                  updateGreetingAndDate()
                  refreshLauncherGrid()
              }

              private fun wakeUpAirPlayServicesSilently() {
                  try {
                      val airApps = allApps.filter { app ->
                          val k = "${app.label.lowercase()} ${app.packageName.lowercase()}"
                          k.contains("acbridge") || k.contains("mhshare")
                      }
                      for (app in airApps) {
                          try {
                              startService(Intent().setPackage(app.packageName))
                          } catch (_: Exception) {}
                      }
                  } catch (_: Exception) {}
              }

              private fun updateGreetingAndDate() {
                  val cal = Calendar.getInstance()
                  val hour = cal.get(Calendar.HOUR_OF_DAY)
                  val greeting = when (hour) {
                      in 5..11 -> " TV  •  ДОБРОЕ УТРО"
                      in 12..17 -> " TV  •  ДОБРЫЙ ДЕНЬ"
                      in 18..22 -> " TV  •  ДОБРЫЙ ВЕЧЕР"
                      else -> " TV  •  ДОБРОЙ НОЧИ"
                  }
                  findViewById<TextView>(R.id.tvGreeting).text = greeting

                  val days = arrayOf("", "ВОСКРЕСЕНЬЕ", "ПОНЕДЕЛЬНИК", "ВТОРНИК", "СРЕДА", "ЧЕТВЕРГ", "ПЯТНИЦА", "СУББОТА")
                  val months = arrayOf(
                      "ЯНВАРЯ", "ФЕВРАЛЯ", "МАРТА", "АПРЕЛЯ", "МАЯ", "ИЮНЯ",
                      "ИЮЛЯ", "АВГУСТА", "СЕНТЯБРЯ", "ОКТЯБРЯ", "НОЯБРЯ", "ДЕКАБРЯ"
                  )
                  val dayName = days[cal.get(Calendar.DAY_OF_WEEK)]
                  val dayNum = cal.get(Calendar.DAY_OF_MONTH)
                  val monthName = months[cal.get(Calendar.MONTH)]

                  findViewById<TextView>(R.id.tvDateTwoLine).text = "$dayName\n$dayNum $monthName"
              }

              private fun setupTopButtons() {
                  val btnSources = findViewById<TextView>(R.id.btnSources)
                  val btnVpn = findViewById<TextView>(R.id.btnVpn)
                  val btnAirPlay = findViewById<TextView>(R.id.btnAirPlay)
                  val btnHidden = findViewById<TextView>(R.id.btnHidden)
                  val btnSettings = findViewById<TextView>(R.id.btnSettings)

                  val pillFocus = View.OnFocusChangeListener { v, hasFocus ->
                      val scale = if (hasFocus) 1.12f else 1.0f
                      v.animate()
                          .scaleX(scale)
                          .scaleY(scale)
                          .setDuration(140)
                          .setInterpolator(DecelerateInterpolator())
                          .start()
                      v.alpha = if (hasFocus) 1.0f else 0.82f
                  }

                  listOf(btnSources, btnVpn, btnAirPlay, btnHidden, btnSettings).forEach {
                      it.onFocusChangeListener = pillFocus
                      it.alpha = 0.82f
                  }

                  btnSources.setOnClickListener {
                      val sources = arrayOf("HDMI 1", "HDMI 2", "HDMI 3", "AV / Композитный", "Все ТВ-входы системы")
                      AlertDialog.Builder(this)
                          .setTitle("Выберите источник сигнала")
                          .setItems(sources) { _, _ -> openTvInputSource() }
                          .show()
                  }

                  btnVpn.setOnClickListener {
                      val vpnApp = allApps.firstOrNull { app ->
                          vpnKeywords.any { kw -> app.label.lowercase().contains(kw) || app.packageName.lowercase().contains(kw) }
                      }
                      if (vpnApp != null) {
                          launchAppEntry(vpnApp)
                      } else {
                          try {
                              startActivity(Intent("android.net.vpn.SETTINGS"))
                          } catch (e: Exception) {
                              startActivity(Intent(Settings.ACTION_WIRELESS_SETTINGS))
                          }
                      }
                  }

                  btnAirPlay.setOnClickListener {
                      showAirPlayCenterDialog()
                  }

                  btnHidden.setOnClickListener {
                      showRestoreHiddenDialog()
                  }

                  btnSettings.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun showAirPlayCenterDialog() {
                  val receivers = allApps.filter { app ->
                      val key = "${app.label.lowercase()} ${app.packageName.lowercase()}"
                      airPlayKeywords.any { kw -> key.contains(kw) }
                  }

                  val menuItems = mutableListOf<String>()
                  val actions = mutableListOf<() -> Unit>()

                  for (app in receivers) {
                      menuItems.add("Запустить ${app.label}")
                      actions.add { launchAppEntry(app) }
                  }

                  menuItems.add("Системные настройки трансляции (Cast)")
                  actions.add {
                      try {
                          startActivity(Intent(Settings.ACTION_CAST_SETTINGS))
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  }

                  AlertDialog.Builder(this)
                      .setTitle("📡 Центр AirPlay")
                      .setItems(menuItems.toTypedArray()) { _, which -> actions[which].invoke() }
                      .show()
              }

              private fun openTvInputSource() {
                  val tvIntents = listOf(
                      Intent("com.android.tv.action.VIEW_INPUTS"),
                      Intent("android.intent.action.TV_INPUT"),
                      Intent(Settings.ACTION_SETTINGS)
                  )
                  for (intent in tvIntents) {
                      if (intent.resolveActivity(packageManager) != null) {
                          startActivity(intent)
                          return
                      }
                  }
              }

              private fun refreshLauncherGrid() {
                  val prefs = getSharedPreferences("tvos_v32_prefs", Context.MODE_PRIVATE)
                  val hiddenSet = prefs.getStringSet("hidden_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()
                  val dockSet = prefs.getStringSet("dock_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()

                  val pm = packageManager
                  allApps = mutableListOf()
                  val seen = HashSet<String>()
                  seen.add(packageName)

                  val leanbackIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER) }
                  val normalIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }

                  val activities = pm.queryIntentActivities(leanbackIntent, 0) + pm.queryIntentActivities(normalIntent, 0)

                  for (info in activities) {
                      val pkg = info.activityInfo.packageName
                      val actName = info.activityInfo.name
                      if (!seen.contains(pkg)) {
                          seen.add(pkg)
                          val label = info.loadLabel(pm).toString()
                          val icon = info.loadIcon(pm)
                          val banner = info.activityInfo.loadBanner(pm) ?: info.activityInfo.applicationInfo.loadBanner(pm)
                          val isSys = (info.activityInfo.applicationInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                          val dominantColor = extractDominantColor(icon)
                          val (studioBitmap, brandColor) = StudioCardGenerator.createCardBitmap(label, pkg, icon, dominantColor)

                          allApps.add(
                              AppEntry(
                                  label = label,
                                  packageName = pkg,
                                  activityName = actName,
                                  icon = icon,
                                  banner = banner,
                                  brandColor = brandColor,
                                  studioCardBitmap = studioBitmap,
                                  isSystem = isSys
                              )
                          )
                      }
                  }

                  allApps.sortWith(compareBy<AppEntry> { it.isSystem }.thenBy { it.label.lowercase() })

                  val visibleApps = allApps.filter { !hiddenSet.contains(it.packageName) }

                  // Адаптивное число колонок (до 6 на широкий экран)
                  val spanCount = if (visibleApps.size >= 6) 6 else if (visibleApps.size in 4..5) visibleApps.size else 4

                  val dockApps = mutableListOf<AppEntry>()
                  for (app in visibleApps) {
                      if (dockSet.contains(app.packageName) && dockApps.size < spanCount) {
                          dockApps.add(app)
                      }
                  }
                  for (app in visibleApps) {
                      if (!dockApps.contains(app) && dockApps.size < spanCount) {
                          dockApps.add(app)
                      }
                  }

                  val gridApps = visibleApps.filter { !dockApps.contains(it) }

                  val dockRv = findViewById<RecyclerView>(R.id.dockRecycler)
                  val gridRv = findViewById<RecyclerView>(R.id.appsGrid)

                  dockRv.layoutManager = GridLayoutManager(this, spanCount)
                  gridRv.layoutManager = GridLayoutManager(this, spanCount)

                  dockRv.adapter = AppAdapter(
                      this,
                      dockApps,
                      onFocused = { updateFocusedAppStage(it, true) },
                      onLaunch = { launchAppEntry(it) },
                      onLongClick = { showAppOptionsDialog(it) }
                  )

                  gridRv.adapter = AppAdapter(
                      this,
                      gridApps,
                      onFocused = { updateFocusedAppStage(it, false) },
                      onLaunch = { launchAppEntry(it) },
                      onLongClick = { showAppOptionsDialog(it) }
                  )

                  if (dockApps.isNotEmpty()) {
                      updateFocusedAppStage(dockApps.first(), true)
                  }
              }

              private fun updateFocusedAppStage(app: AppEntry, isInDock: Boolean) {
                  val titleView = findViewById<TextView>(R.id.tvFocusedAppTitle)
                  val hintView = findViewById<TextView>(R.id.tvFocusedAppHint)
                  val ambientView = findViewById<View>(R.id.ambientGlowView)

                  titleView.text = app.label
                  val zone = if (isInDock) "Apple TV Dock" else "Все приложения"
                  hintView.text = "$zone  •  ОК — открыть  •  Удерживайте ОК — настроить"

                  // Живые обои tvOS: плавная смена фонового цвета под брендом выбранного приложения
                  val targetColor = Color.argb(
                      155,
                      Color.red(app.brandColor),
                      Color.green(app.brandColor),
                      Color.blue(app.brandColor)
                  )

                  val animator = ValueAnimator.ofObject(ArgbEvaluator(), currentAmbientColor, targetColor)
                  animator.duration = 320
                  animator.addUpdateListener { va ->
                      val animatedColor = va.animatedValue as Int
                      val bg = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(
                              animatedColor,
                              Color.parseColor("#0C101C"),
                              Color.parseColor("#050608")
                          )
                      )
                      ambientView.background = bg
                  }
                  animator.start()
                  currentAmbientColor = targetColor
              }

              private fun showAppOptionsDialog(app: AppEntry) {
                  val prefs = getSharedPreferences("tvos_v32_prefs", Context.MODE_PRIVATE)
                  val dockSet = prefs.getStringSet("dock_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()
                  val hiddenSet = prefs.getStringSet("hidden_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()

                  val isInDock = dockSet.contains(app.packageName)
                  val dockOption = if (isInDock) "Убрать из верхнего Дока" else "Закрепить в верхнем Доке"

                  val options = arrayOf("Запустить ${app.label}", dockOption, "Скрыть карточку с экрана", "Свойства")

                  AlertDialog.Builder(this)
                      .setTitle(app.label)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> launchAppEntry(app)
                              1 -> {
                                  if (isInDock) dockSet.remove(app.packageName) else dockSet.add(app.packageName)
                                  prefs.edit().putStringSet("dock_pkgs", dockSet).apply()
                                  refreshLauncherGrid()
                              }
                              2 -> {
                                  hiddenSet.add(app.packageName)
                                  prefs.edit().putStringSet("hidden_pkgs", hiddenSet).apply()
                                  refreshLauncherGrid()
                              }
                              3 -> {
                                  startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                                      data = android.net.Uri.parse("package:${app.packageName}")
                                  })
                              }
                          }
                      }
                      .show()
              }

              private fun showRestoreHiddenDialog() {
                  val prefs = getSharedPreferences("tvos_v32_prefs", Context.MODE_PRIVATE)
                  val hiddenSet = prefs.getStringSet("hidden_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()

                  if (hiddenSet.isEmpty()) {
                      Toast.makeText(this, "Скрытых приложений нет", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val hiddenApps = allApps.filter { hiddenSet.contains(it.packageName) }
                  val names = hiddenApps.map { it.label }.toTypedArray()

                  AlertDialog.Builder(this)
                      .setTitle("Скрытые приложения:")
                      .setItems(names) { _, which ->
                          hiddenSet.remove(hiddenApps[which].packageName)
                          prefs.edit().putStringSet("hidden_pkgs", hiddenSet).apply()
                          refreshLauncherGrid()
                      }
                      .setNeutralButton("Вернуть все") { _, _ ->
                          prefs.edit().putStringSet("hidden_pkgs", emptySet()).apply()
                          refreshLauncherGrid()
                      }
                      .show()
              }

              private fun launchAppEntry(app: AppEntry) {
                  try {
                      startActivity(Intent(Intent.ACTION_MAIN).apply {
                          component = ComponentName(app.packageName, app.activityName)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      })
                      return
                  } catch (_: Exception) {}

                  try {
                      val intent = packageManager.getLeanbackLaunchIntentForPackage(app.packageName) ?: packageManager.getLaunchIntentForPackage(app.packageName)
                      if (intent != null) startActivity(intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Не удалось запустить", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun extractDominantColor(drawable: Drawable): Int {
                  return try {
                      val bmp = Bitmap.createBitmap(40, 40, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      drawable.setBounds(0, 0, 40, 40)
                      drawable.draw(canvas)
                      var rSum = 0L; var gSum = 0L; var bSum = 0L; var count = 0
                      for (x in 4 until 36 step 4) {
                          for (y in 4 until 36 step 4) {
                              val p = bmp.getPixel(x, y)
                              if (Color.alpha(p) > 180) {
                                  rSum += Color.red(p); gSum += Color.green(p); bSum += Color.blue(p); count++
                              }
                          }
                      }
                      bmp.recycle()
                      if (count > 0) Color.rgb((rSum / count).toInt(), (gSum / count).toInt(), (bSum / count).toInt())
                      else Color.parseColor("#2B3548")
                  } catch (e: Exception) {
                      Color.parseColor("#2B3548")
                  }
              }
          }
