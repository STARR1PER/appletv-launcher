} catch (e: Exception) {
Toast.makeText(this, "Не удалось загрузить фото", Toast.LENGTH_SHORT).show()
}
}
}

private fun decodeSampled(path: String, reqW: Int, reqH: Int): Bitmap? {
return try {
val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
BitmapFactory.decodeFile(path, bounds)
var sample = 1
while (bounds.outWidth / (sample * 2) >= reqW && bounds.outHeight / (sample * 2) >= reqH) sample *= 2
val opts = BitmapFactory.Options().apply { inSampleSize = sample }
BitmapFactory.decodeFile(path, opts)
} catch (_: Throwable) {
null
}
}

// Полная перерисовка фона: вызывается при старте и после смены обоев
private fun applyWallpaper() {
val imageView = findViewById<ImageView>(R.id.customWallpaperImage)
val ambientView = findViewById<View>(R.id.ambientGlowView)
val customPath = prefs.getString("custom_wallpaper_path", null)

if (!customPath.isNullOrBlank() && File(customPath).exists()) {
val bmp = decodeSampled(customPath, 1920, 1080)
if (bmp != null) {
imageView.setImageBitmap(bmp)
imageView.visibility = View.VISIBLE
ambientView.background = GradientDrawable(
GradientDrawable.Orientation.TOP_BOTTOM,
intArrayOf(Color.parseColor("#66000000"), Color.parseColor("#11000000"), Color.parseColor("#88000000"))
)
customWallpaperActive = true
return
}
}

customWallpaperActive = false
imageView.setImageDrawable(null)
imageView.visibility = View.GONE
applyGradientBackground(lastAccent)
}

private fun applyGradientBackground(accent: Int) {
val mode = prefs.getInt("wallpaper_mode", 0).coerceIn(0, gradientPresets.size - 1)
val preset = gradientPresets[mode].second
val colors = preset ?: run {
val glow = if (ColorUtils.calculateLuminance(accent) > 0.6) Color.parseColor("#1E3A5F") else manipulateColor(accent, 0.55f)
intArrayOf(glow, Color.parseColor("#0B132B"), Color.parseColor("#05070F"))
}
findViewById<View>(R.id.ambientGlowView).background =
GradientDrawable(GradientDrawable.Orientation.TL_BR, colors)
}

// Лёгкое обновление при смене фокуса: фото не перечитывается с диска
private fun onAppFocused(color: Int) {
lastAccent = color
if (!customWallpaperActive && prefs.getInt("wallpaper_mode", 0) == 0) {
applyGradientBackground(color)
}
}

