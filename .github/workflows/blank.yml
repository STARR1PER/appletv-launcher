// ИИ-ПОМОЩНИК (вместо «Салюта»): установленное приложение или встроенный браузер
// =========================================================================
private fun openAi() {
val saved = prefs.getString("ai_app_pkg", null)
if (saved != null && isInstalled(saved)) {
launchPackage(saved)
return
}
val known = listOf("com.google.android.apps.bard", "com.openai.chatgpt", "com.microsoft.copilot")
val found = known.firstOrNull { isInstalled(it) }
if (found != null) launchPackage(found) else openBuiltInAiWebView()
}

private fun showAiAppPicker() {
val apps = getAllLaunchableApps()
val labels = mutableListOf("🌐 Встроенный браузер (Gemini / ChatGPT)")
labels.addAll(apps.map { it.second })
dlg()
.setTitle("✨ Чем открывать ИИ-помощника")
.setItems(labels.toTypedArray()) { _, idx ->
if (idx == 0) {
prefs.edit().remove("ai_app_pkg").apply()
openBuiltInAiWebView()
} else {
prefs.edit().putString("ai_app_pkg", apps[idx - 1].first).apply()
launchPackage(apps[idx - 1].first)
}
}
.setNegativeButton("Отмена", null)
.show()
}

private fun openBuiltInAiWebView() {
val dialog = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
val container = LinearLayout(this).apply {
orientation = LinearLayout.VERTICAL
setBackgroundColor(Color.parseColor("#0B0D14"))
}
val topBar = LinearLayout(this).apply {
orientation = LinearLayout.HORIZONTAL
gravity = Gravity.CENTER_VERTICAL
setPadding(36, 20, 36, 20)
setBackgroundColor(Color.parseColor("#161924"))
}
val title = TextView(this).apply {
text = "✨ Gemini / ChatGPT"
setTextColor(Color.WHITE)
textSize = 16f
}
val webView = WebView(this)
val btnGemini = Button(this).apply {
text = "Gemini"
setOnClickListener {
prefs.edit().putString("ai_default_url", "https://gemini.google.com").apply()
webView.loadUrl("https://gemini.google.com")
}
}
val btnChatGpt = Button(this).apply {
text = "ChatGPT"
setOnClickListener {
prefs.edit().putString("ai_default_url", "https://chatgpt.com").apply()
webView.loadUrl("https://chatgpt.com")
}
}
val btnClose = Button(this).apply {
text = "Закрыть ✕"
setOnClickListener { dialog.dismiss() }
}
topBar.addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
topBar.addView(btnGemini)
topBar.addView(btnChatGpt)
topBar.addView(btnClose)

webView.settings.apply {
javaScriptEnabled = true
domStorageEnabled = true
cacheMode = WebSettings.LOAD_DEFAULT
}
webView.webViewClient = WebViewClient()
webView.webChromeClient = WebChromeClient()
webView.loadUrl(prefs.getString("ai_default_url", "https://chatgpt.com") ?: "https://chatgpt.com")

container.addView(topBar)
container.addView(webView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
dialog.setContentView(container)
dialog.show()
}

