          EOF

          # layout/item_app_tile.xml
          cat << 'EOF' > app/src/main/res/layout/item_app_tile.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="7dp"
              android:clipChildren="false"
              android:clipToPadding="false">

              <FrameLayout
                  android:id="@+id/appCardView"
                  android:layout_width="142dp"
                  android:layout_height="80dp"
                  android:layout_gravity="center"
                  android:clickable="true"
                  android:focusable="true">

                  <ImageView
                      android:id="@+id/appCardArtwork"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="centerCrop" />

                  <View
                      android:id="@+id/focusBorder"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />
              </FrameLayout>
          </FrameLayout>
          EOF

          # AppAdapter.kt
          cat << 'EOF' > app/src/main/java/com/appletv/launcher/AppAdapter.kt
          package com.appletv.launcher

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.animation.DecelerateInterpolator
          import android.widget.ImageView
          import androidx.recyclerview.widget.RecyclerView

          data class AppEntry(
              val label: String,
              val packageName: String,
              val activityName: String,
              val icon: Drawable,
              val banner: Drawable?,
              val brandColor: Int,
              val studioCardBitmap: Bitmap,
              val isSystem: Boolean
          )

          class AppAdapter(
              private val context: Context,
              private val items: List<AppEntry>,
              private val onFocused: (AppEntry) -> Unit,
              private val onLaunch: (AppEntry) -> Unit,
              private val onLongClick: (AppEntry) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.ViewHolder>() {

              private val density = context.resources.displayMetrics.density

              class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                  val card: View = view.findViewById(R.id.appCardView)
                  val artworkView: ImageView = view.findViewById(R.id.appCardArtwork)
                  val focusBorder: View = view.findViewById(R.id.focusBorder)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                  val v = LayoutInflater.from(context).inflate(R.layout.item_app_tile, parent, false)
                  return ViewHolder(v)
              }

              override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                  val app = items[position]
                  val radiusPx = 16f * density

                  val clipBg = GradientDrawable().apply {
                      cornerRadius = radiusPx
                      setColor(app.brandColor)
                  }
                  holder.card.background = clipBg
                  holder.card.outlineProvider = ViewOutlineProvider.BACKGROUND
                  holder.card.clipToOutline = true

                  if (app.banner != null) {
                      holder.artworkView.setImageDrawable(app.banner)
                  } else {
                      holder.artworkView.setImageBitmap(app.studioCardBitmap)
                  }

                  val borderDrawable = GradientDrawable().apply {
                      cornerRadius = radiusPx
                      setColor(Color.TRANSPARENT)
                      setStroke((2.5f * density).toInt(), Color.WHITE)
                  }
                  holder.focusBorder.background = borderDrawable
                  holder.focusBorder.alpha = 0f

                  holder.card.setOnFocusChangeListener { v, hasFocus ->
                      val scale = if (hasFocus) 1.15f else 1.0f
                      val elevation = if (hasFocus) 28f else 2f
                      v.animate()
                          .scaleX(scale)
                          .scaleY(scale)
                          .translationZ(elevation)
                          .setDuration(160)
                          .setInterpolator(DecelerateInterpolator())
                          .start()

                      holder.focusBorder.animate()
                          .alpha(if (hasFocus) 1f else 0f)
                          .setDuration(140)
                          .start()

                      if (hasFocus) {
                          onFocused(app)
                      }
                  }

                  holder.card.setOnClickListener {
                      onLaunch(app)
                  }

                  holder.card.setOnLongClickListener {
                      onLongClick(app)
                      true
                  }
              }

              override fun getItemCount(): Int = items.size
          }

          object StudioCardGenerator {

              data class BrandStyle(
                  val c1: Int,
                  val c2: Int,
                  val titleText: String,
                  val textColor: Int = Color.WHITE
              )

              fun resolveBrandStyle(label: String, pkg: String, fallbackColor: Int): BrandStyle {
                  val key = "${label.lowercase()} ${pkg.lowercase()}"
                  return when {
                      key.contains("youtube") -> BrandStyle(Color.parseColor("#FFFFFF"), Color.parseColor("#E8EAED"), "YouTube", Color.parseColor("#111111"))
                      key.contains("apple") -> BrandStyle(Color.parseColor("#2C2C2E"), Color.parseColor("#141416"), "tv")
                      key.contains("netflix") -> BrandStyle(Color.parseColor("#191919"), Color.parseColor("#080808"), "NETFLIX", Color.parseColor("#E50914"))
                      key.contains("okko") || key.contains("окко") -> BrandStyle(Color.parseColor("#7B2CBF"), Color.parseColor("#3C096C"), "ökko")
                      key.contains("кинопоиск") || key.contains("kinopoisk") -> BrandStyle(Color.parseColor("#1F1F24"), Color.parseColor("#0F0F12"), "КИНОПОИСК", Color.parseColor("#FF5500"))
                      key.contains("twitch") -> BrandStyle(Color.parseColor("#9146FF"), Color.parseColor("#5C16C5"), "twitch")
                      key.contains("spotify") -> BrandStyle(Color.parseColor("#1DB954"), Color.parseColor("#117A37"), "Spotify")
                      key.contains("rutube") -> BrandStyle(Color.parseColor("#8A2BE2"), Color.parseColor("#005BFF"), "RUTUBE")
                      key.contains("vk") || key.contains("вк") -> BrandStyle(Color.parseColor("#0077FF"), Color.parseColor("#0044AA"), "VK Видео")
                      key.contains("happ") -> BrandStyle(Color.parseColor("#1E222D"), Color.parseColor("#0D1017"), "Happ")
                      key.contains("airscreen") -> BrandStyle(Color.parseColor("#00B4DB"), Color.parseColor("#0083B0"), "AirScreen")
                      key.contains("mhshare") -> BrandStyle(Color.parseColor("#0A84FF"), Color.parseColor("#0055B3"), "MHshare")
                      key.contains("acbridge") -> BrandStyle(Color.parseColor("#30B0C7"), Color.parseColor("#1D6F8A"), "ACBridge")
                      key.contains("24тв") || key.contains("24tv") -> BrandStyle(Color.parseColor("#1E3C72"), Color.parseColor("#2A5298"), "24ТВ")
                      key.contains("vlc") -> BrandStyle(Color.parseColor("#FF8008"), Color.parseColor("#CC5500"), "VLC")
                      else -> {
                          val hsv = FloatArray(3)
                          Color.colorToHSV(fallbackColor, hsv)
                          val topC = Color.HSVToColor(floatArrayOf(hsv[0], (hsv[1] * 0.9f).coerceIn(0.35f, 1f), (hsv[2] * 1.15f).coerceIn(0.30f, 0.78f)))
                          val botC = Color.HSVToColor(floatArrayOf(hsv[0], hsv[1].coerceIn(0.4f, 1f), (hsv[2] * 0.55f).coerceIn(0.12f, 0.45f)))
                          BrandStyle(topC, botC, label)
                      }
                  }
              }

              fun createCardBitmap(label: String, pkg: String, icon: Drawable, fallbackColor: Int): Pair<Bitmap, Int> {
                  val width = 320
                  val height = 180
                  val bmp = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)

                  val style = resolveBrandStyle(label, pkg, fallbackColor)

                  val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(
                          0f, 0f, width.toFloat(), height.toFloat(),
                          style.c1, style.c2, Shader.TileMode.CLAMP
                      )
                  }
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), bgPaint)

                  val sheenPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(
                          0f, 0f, 0f, height * 0.55f,
                          Color.argb(45, 255, 255, 255),
                          Color.argb(0, 255, 255, 255),
                          Shader.TileMode.CLAMP
                      )
                  }
                  canvas.drawRect(0f, 0f, width.toFloat(), height * 0.55f, sheenPaint)

                  val iconSize = 68
                  val iconBmp = Bitmap.createBitmap(iconSize, iconSize, Bitmap.Config.ARGB_8888)
                  val iconCanvas = Canvas(iconBmp)
                  icon.setBounds(0, 0, iconSize, iconSize)
                  icon.draw(iconCanvas)

                  val shortLabel = style.titleText
                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = style.textColor
                      textSize = if (shortLabel.length > 9) 24f else 28f
                      typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
                  }

                  val displayLabel = if (shortLabel.length > 12) shortLabel.take(11) + "…" else shortLabel
                  val textWidth = textPaint.measureText(displayLabel)
                  val gap = 16f
                  val totalWidth = iconSize + gap + textWidth
                  val startX = ((width - totalWidth) / 2f).coerceAtLeast(22f)
                  val iconTop = (height - iconSize) / 2f

                  val shader = BitmapShader(iconBmp, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP)
                  val matrix = Matrix()
                  matrix.setTranslate(startX, iconTop)
                  shader.setLocalMatrix(matrix)

                  val squirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      this.shader = shader
                  }
                  val rect = RectF(startX, iconTop, startX + iconSize, iconTop + iconSize)
                  canvas.drawRoundRect(rect, 18f, 18f, squirclePaint)

                  val fontMetrics = textPaint.fontMetrics
                  val textY = height / 2f - (fontMetrics.ascent + fontMetrics.descent) / 2f
                  canvas.drawText(displayLabel, startX + iconSize + gap, textY, textPaint)

                  iconBmp.recycle()
                  val ambientColor = if (style.c1 == Color.parseColor("#FFFFFF")) Color.parseColor("#CC1A1A") else style.c1
                  return Pair(bmp, ambientColor)
              }
          }
