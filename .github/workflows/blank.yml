name: Build Ultimate Apple tvOS Launcher

on:
  workflow_dispatch:

jobs:
  build-tvos-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Zulu JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate tvOS Launcher Source Code
        run: |
          mkdir -p app/src/main/java/com/appletv/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AppleTvLauncher"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.appletv.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.appletv.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Apple TV Pro"
                  android:theme="@style/Theme.AppleTv">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Ресурсы цветов
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="tvos_bg_dark">#0A0A0F</color>
              <color name="tvos_card_normal">#15161E</color>
              <color name="tvos_text_primary">#FFFFFF</color>
              <color name="tvos_text_secondary">#7E828C</color>
              <color name="tvos_accent_blue">#007AFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppleTv" parent="Theme.MaterialComponents.NoActionBar">
                  <item name="android:windowBackground">@color/tvos_bg_dark</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          # 6. Разметка интерфейса (activity_main.xml) - УВЕЛИЧИЛИ РАССТОЯНИЕ И СДЕЛАЛИ МЕСТО ПОСЕРЕДИНЕ
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://android.com"
              xmlns:app="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/tvos_bg_dark">

              <!-- Крупные часы сверху по центру -->
              <TextView
                  android:id="@+id/tvClock"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="32dp"
                  android:text="12:00"
                  android:textColor="@color/tvos_text_primary"
                  android:textSize="28sp"
                  android:fontFamily="sans-serif-light"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <!-- Нижняя сетка приложений - ОПУЩЕНА ВНИЗ, ЧТОБЫ ОСВОБОДИТЬ ЦЕНТР ЭКРАНА -->
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvApps"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_marginTop="160dp"
                  android:paddingStart="80dp"
                  android:paddingEnd="80dp"
                  android:clipToPadding="false"
                  app:layout_constraintTop_toBottomOf="@id/tvClock"
                  app:layout_constraintBottom_toBottomOf="parent"/>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # 7. Элемент сетки (item_app.xml)
          cat << 'EOF' > app/src/main/res/layout/item_app.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="16dp"
              android:focusable="true"
              android:clickable="true">
              <ImageView
                  android:id="@+id/ivAppIcon"
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:background="@android:drawable/dialog_holo_dark_frame"
                  android:padding="10dp"/>
              <TextView
                  android:id="@+id/tvAppName"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textColor="@color/tvos_text_secondary"
                  android:textSize="14sp"
                  android:singleLine="true" />
          </LinearLayout>
          EOF

          # 8. Логика переназначения кнопок пульта Okko/Иви/Смотрим (MainActivity.kt)
          cat << 'EOF' > app/src/main/java/com/appletv/launcher/MainActivity.kt
          package com.appletv.launcher

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val tvClock = findViewById<TextView>(R.id.tvClock)
                  tvClock.text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())

                  val rvApps = findViewById<RecyclerView>(R.id.rvApps)
                  rvApps.layoutManager = GridLayoutManager(this, 5)

                  val focusListener = View.OnFocusChangeListener { v, hasFocus ->
                      if (hasFocus) {
                          v.animate().scaleX(1.14f).scaleY(1.14f).setDuration(150).start()
                      } else {
                          v.animate().scaleX(1.0f).scaleY(1.0f).setDuration(150).start()
                      }
                  }

                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  val appsList = packageManager.queryIntentActivities(mainIntent, 0)
                  
                  rvApps.adapter = AppAdapter(appsList, focusListener) { info ->
Используйте код с осторожностью.
val launchIntent = packageManager.getLaunchIntentForPackage(info.activityInfo.packageName)
if (launchIntent != null) startActivity(launchIntent)
}
}
// ПЕРЕНАЗНАЧЕНИЕ КНОПОК ПУЛЬТА СБЕРА (Okko, Иви, Смотрим)
override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
when (keyCode) {
// Кнопка Смотрим (обычно отправляет KEYCODE_BUTTON_1 или BUTTON_2)
KeyEvent.KEYCODE_BUTTON_1, KeyEvent.KEYCODE_PROG_RED -> {
// По кнопке "Смотрим" принудительно открываем наш ИИ
startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://chatgpt.com")))
return true
}
// Кнопка Иви
KeyEvent.KEYCODE_BUTTON_2, KeyEvent.KEYCODE_PROG_GREEN -> {
// По кнопке "Иви" запускаем автопоиск VPN клиентов
val vpns = listOf("com.happ.proxy", "org.outline.android.client", "com.wireguard.android")
for (pkg in vpns) {
val intent = packageManager.getLaunchIntentForPackage(pkg)
if (intent != null) {
startActivity(intent)
return true
}
}
startActivity(Intent("android.net.vpn.SETTINGS"))
return true
}
// Кнопка Okko
KeyEvent.KEYCODE_BUTTON_3, KeyEvent.KEYCODE_PROG_YELLOW -> {
// По кнопке "Okko" запускаем AirPlay (приложение AirScreen)
val intent = packageManager.getLaunchIntentForPackage("com.ionitech.airscreen")
if (intent != null) startActivity(intent)
return true
}
}
return super.onKeyDown(keyCode, event)
}
}
EOF
