private fun isInstalled(pkg: String): Boolean =
packageManager.getLaunchIntentForPackage(pkg) != null ||
packageManager.getLeanbackLaunchIntentForPackage(pkg) != null

private fun getAllLaunchableApps(): List<Pair<String, String>> {
val pm = packageManager
val infos = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER), 0) +
pm.queryIntentActivities(Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER), 0)
return infos
.map { it.activityInfo.packageName to it.loadLabel(pm).toString() }
.filter { it.first != packageName }
.distinctBy { it.first }
.sortedBy { it.second.lowercase() }
}

private fun findAirPlayReceiver(): String? {
val keys = listOf("airscreen", "airplay", "air receiver", "airreceiver", "airplayer", "letsview", "lebo", "mirror")
return getAllLaunchableApps().firstOrNull { (pkg, label) ->
keys.any { pkg.lowercase().contains(it) || label.lowercase().contains(it) }
}?.first
}

private fun openAirPlay() {
val saved = prefs.getString("airplay_receiver_pkg", null)
val pkg = if (saved != null && isInstalled(saved)) saved else findAirPlayReceiver()
if (pkg != null) {
launchPackage(pkg)
} else {
showAirPlayReceiverPicker()
}
}

private fun showAirPlayReceiverPicker() {
val apps = getAllLaunchableApps()
if (apps.isEmpty()) {
Toast.makeText(this, "Приложения не найдены", Toast.LENGTH_SHORT).show()
return
}
dlg()
.setTitle("📡 Какое приложение принимает AirPlay?")
.setItems(apps.map { it.second }.toTypedArray()) { _, idx ->
prefs.edit().putString("airplay_receiver_pkg", apps[idx].first).apply()
launchPackage(apps[idx].first)
}
.setNegativeButton("Отмена", null)
.show()
}

