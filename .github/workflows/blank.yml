              private fun openSystemFilePickerForWallpaper() {
                  try {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "image/*"
                      }
                      startActivityForResult(intent, REQ_PICK_WALLPAPER_IMAGE)
                  } catch (_: Exception) {
                      try {
                          val fallback = Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*" }
                          startActivityForResult(fallback, REQ_PICK_WALLPAPER_IMAGE)
                      } catch (_: Exception) {
                          // Если на ТВ вырезан системный проводник, сканируем папки напрямую
                          scanDeviceFoldersForImages()
                      }
                  }
              }

              private fun scanDeviceFoldersForImages() {
                  val foundFiles = mutableListOf<File>()
                  val dirsToScan = listOf(
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES),
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM),
                      File("/sdcard/Download"),
                      File("/sdcard/Pictures"),
                      File("/storage/emulated/0/Download"),
                      File("/storage/emulated/0/Pictures")
                  )

                  val extensions = listOf(".jpg", ".jpeg", ".png", ".webp")
                  for (dir in dirsToScan) {
                      if (dir != null && dir.exists() && dir.isDirectory) {
                          dir.listFiles()?.forEach { file ->
                              if (file.isFile && extensions.any { file.name.lowercase().endsWith(it) }) {
                                  if (foundFiles.none { it.absolutePath == file.absolutePath }) {
                                      foundFiles.add(file)
                                  }
                              }
                          }
                      }
                  }

                  if (foundFiles.isEmpty()) {
                      AlertDialog.Builder(this)
                          .setTitle("Фото не найдены")
                          .setMessage("Скиньте любую картинку (.jpg или .png) на телевизор в папку Download или Pictures (например, через ADB AppControl или SendFilesToTV), и она сразу появится здесь!")
                          .setPositiveButton("Понятно", null)
                          .show()
                      return
                  }

                  val names = foundFiles.map { "🖼 ${it.name} (${it.length() / 1024} КБ)" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Выберите фото из памяти ТВ:")
                      .setItems(names) { _, idx ->
                          applyImageFileAsWallpaper(foundFiles[idx])
                      }
                      .show()
              }

              private fun applyImageFileAsWallpaper(sourceFile: File) {
                  try {
                      val destFile = File(filesDir, "custom_wallpaper.jpg")
                      sourceFile.inputStream().use { input ->
                          FileOutputStream(destFile).use { output ->
                              input.copyTo(output)
                          }
                      }
                      prefs.edit().putString("custom_wallpaper_path", destFile.absolutePath).apply()
                      loadWallpaperState(Color.BLACK)
                      Toast.makeText(this, "Фото-обои успешно установлены!", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Ошибка чтения файла: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_PICK_WALLPAPER_IMAGE && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          val destFile = File(filesDir, "custom_wallpaper.jpg")
                          contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(destFile).use { output ->
                                  input.copyTo(output)
                              }
                          }
                          prefs.edit().putString("custom_wallpaper_path", destFile.absolutePath).apply()
                          loadWallpaperState(Color.BLACK)
                          Toast.makeText(this, "Фото-обои успешно установлены!", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Не удалось загрузить фото", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun loadWallpaperState(accentColor: Int) {
                  val imageView = findViewById<ImageView>(R.id.customWallpaperImage)
                  val ambientView = findViewById<View>(R.id.ambientGlowView)
                  val customPath = prefs.getString("custom_wallpaper_path", null)

                  if (!customPath.isNullOrBlank() && File(customPath).exists()) {
                      val opts = BitmapFactory.Options().apply {
                          inPreferredConfig = Bitmap.Config.RGB_565
                      }
                      val bmp = BitmapFactory.decodeFile(customPath, opts)
                      if (bmp != null) {
                          imageView.setImageBitmap(bmp)
                          imageView.visibility = View.VISIBLE
                          // Легкая виньетка сверху и снизу, чтобы белые часы и док всегда идеально читались на любом фото
                          ambientView.background = GradientDrawable(
                              GradientDrawable.Orientation.TOP_BOTTOM,
                              intArrayOf(Color.parseColor("#66000000"), Color.parseColor("#11000000"), Color.parseColor("#88000000"))
                          )
                          return
                      }
                  }

                  imageView.visibility = View.GONE
                  val mode = prefs.getInt("wallpaper_mode", 0)
                  val colors = when (mode) {
                      0 -> {
                          val glow = if (accentColor == Color.parseColor("#F5F5F7")) Color.parseColor("#1E3A5F") else manipulateColor(accentColor, 0.55f)
                          intArrayOf(glow, Color.parseColor("#0B132B"), Color.parseColor("#05070F"))
                      }
                      else -> intArrayOf(Color.parseColor("#14213D"), Color.parseColor("#080D1A"), Color.parseColor("#020408"))
                  }
                  ambientView.background = GradientDrawable(GradientDrawable.Orientation.TL_BR, colors)
              }

