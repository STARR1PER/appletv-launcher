              private fun isJunkSystemApp(pkg: String, label: String, appInfo: ApplicationInfo): Boolean {
                  val p = pkg.lowercase()
                  val l = label.lowercase()

                  val whitelist = listOf(
                      "youtube", "kinopoisk", "wink", "ivi", "okko", "kion", "premier", "start",
                      "vlc", "kodi", "plex", "num", "lampa", "torrserve", "smarttube", "rutube",
                      "vkvideo", "vk.video", "v2ray", "nekobox", "outline", "wireguard", "openvpn",
                      "adguard", "hidemy", "windscribe", "proton", "psiphon", "chrome", "firefox",
                      "opera", "sendfiles", "cxinventor", "plombir", "zona", "hdrezka", "spotify",
                      "twitch", "netflix", "happ", "apple"
                  )
                  if (whitelist.any { p.contains(it) || l.contains(it) }) return false

                  val blacklist = listOf(
                      "parentcontrol", "webview", "inputmethod", "keyboard", "bluetooth",
                      "packageinstaller", "certinstaller", "captiveportal", "dreams", "screensaver",
                      "printspooler", "statementservice", "companion", "callout", "salute", "sber",
                      "starlauncher", "katniss", "leanbacklauncher", "tvrecommendations", "provision"
                  )
                  if (blacklist.any { p.contains(it) || l.contains(it) }) return true

                  val isSystem = (appInfo.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                  val isUpdatedSystem = (appInfo.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0
                  if (isSystem && !isUpdatedSystem) {
                      if (p.startsWith("com.android.") || p.startsWith("android.") || p.startsWith("com.google.android.tv")) {
                          return true
                      }
                  }
                  return false
              }

              private fun refreshApps() {
                  val pm = packageManager
                  val rawMap = mutableMapOf<String, ResolveInfo>()
                  val hiddenSet = getHiddenPackages()

                  val mainIntent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                  val tvIntent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)

                  for (info in pm.queryIntentActivities(mainIntent, 0) + pm.queryIntentActivities(tvIntent, 0)) {
                      val pkg = info.activityInfo.packageName
                      if (pkg != packageName && !hiddenSet.contains(pkg)) {
                          rawMap[pkg] = info
                      }
                  }

                  val filtered = mutableListOf<AppEntry>()
                  for ((pkg, info) in rawMap) {
                      val label = info.loadLabel(pm).toString()
                      val appInfo = info.activityInfo.applicationInfo
                      if (isJunkSystemApp(pkg, label, appInfo)) continue

                      val icon = info.loadIcon(pm)
                      val banner = info.activityInfo.loadBanner(pm) ?: appInfo.loadBanner(pm)
                      val brandColor = detectBrandColor(label, pkg)
                      val bmp = renderVibeTvCardBitmap(label, pkg, icon, banner, brandColor)
                      filtered.add(AppEntry(label, pkg, icon, banner, brandColor, bmp))
                  }

                  val savedOrder = (prefs.getString("saved_app_order", "") ?: "")
                      .split(",").filter { it.isNotBlank() }

                  filtered.sortWith(Comparator { a, b ->
                      val idxA = savedOrder.indexOf(a.packageName)
                      val idxB = savedOrder.indexOf(b.packageName)
                      when {
                          idxA != -1 && idxB != -1 -> idxA.compareTo(idxB)
                          idxA != -1 -> -1
                          idxB != -1 -> 1
                          else -> a.label.compareTo(b.label, ignoreCase = true)
                      }
                  })

                  allApps = filtered
                  setupSingleRowDockAdapter()
              }

              private fun saveCurrentAppOrder() {
                  val combined = allApps.joinToString(",") { it.packageName }
                  prefs.edit().putString("saved_app_order", combined).apply()
              }

              private fun detectBrandColor(label: String, pkg: String): Int {
                  val s = "$label $pkg".lowercase()
                  return when {
                      s.contains("youtube") || s.contains("smarttube") -> Color.parseColor("#F5F5F7")
                      s.contains("netflix") -> Color.parseColor("#F5F5F7")
                      s.contains("okko") -> Color.parseColor("#5E2B97")
                      s.contains("кинопоиск") || s.contains("kinopoisk") -> Color.parseColor("#FF5500")
                      s.contains("twitch") -> Color.parseColor("#6441A5")
                      s.contains("rutube") -> Color.parseColor("#4B2882")
                      s.contains("spotify") -> Color.parseColor("#18181C")
                      s.contains("vk") -> Color.parseColor("#19191D")
                      s.contains("wink") || s.contains("винк") -> Color.parseColor("#FF5C00")
                      s.contains("иви") || s.contains("ivi") -> Color.parseColor("#EA003D")
                      s.contains("happ") || s.contains("v2ray") || s.contains("vpn") -> Color.parseColor("#2B3A4A")
                      else -> {
                          val hash = pkg.hashCode()
                          Color.HSVToColor(floatArrayOf(((hash and 0xFF) % 360).toFloat(), 0.60f, 0.28f))
                      }
                  }
              }

              private fun renderVibeTvCardBitmap(label: String, pkg: String, icon: Drawable, banner: Drawable?, brandColor: Int): Bitmap {
                  val width = 320
                  val height = 184
                  val bmp = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)

                  if (banner != null) {
                      banner.setBounds(0, 0, width, height)
                      banner.draw(canvas)
                      return bmp
                  }

                  val isLightCard = brandColor == Color.parseColor("#F5F5F7")
                  val c2 = if (isLightCard) Color.parseColor("#E5E5EA") else manipulateColor(brandColor, 0.65f)

                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  paint.shader = LinearGradient(0f, 0f, width.toFloat(), height.toFloat(), brandColor, c2, Shader.TileMode.CLAMP)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)

                  val iconSize = 68
                  val left = (width - iconSize) / 2
                  val top = (height - iconSize) / 2 - 14
                  icon.setBounds(left, top, left + iconSize, top + iconSize)
                  icon.draw(canvas)

                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = if (isLightCard) Color.parseColor("#111111") else Color.WHITE
                      textSize = 21f
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      textAlign = Paint.Align.CENTER
                      if (!isLightCard) setShadowLayer(4f, 0f, 2f, Color.BLACK)
                  }
                  val shortLabel = if (label.length > 15) label.take(13) + "…" else label
                  canvas.drawText(shortLabel, width / 2f, height - 20f, textPaint)

                  return bmp
              }

              private fun manipulateColor(color: Int, factor: Float): Int {
                  val a = Color.alpha(color)
                  val r = Math.round(Color.red(color) * factor).coerceAtMost(255)
                  val g = Math.round(Color.green(color) * factor).coerceAtMost(255)
                  val b = Math.round(Color.blue(color) * factor).coerceAtMost(255)
                  return Color.argb(a, r, g, b)
              }

              private fun setupSingleRowDockAdapter() {
                  val dockRv = findViewById<RecyclerView>(R.id.dockRecycler)
                  dockRv.layoutManager = LinearLayoutManager(this, LinearLayoutManager.HORIZONTAL, false)
                  dockRv.adapter = object : RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                      override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                          val v = layoutInflater.inflate(R.layout.item_app_tile, parent, false)
                          return object : RecyclerView.ViewHolder(v) {}
                      }

                      override fun getItemCount() = allApps.size

                      override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {
                          val app = allApps[position]
                          val cardView = holder.itemView.findViewById<FrameLayout>(R.id.appCardView)
                          val artwork = holder.itemView.findViewById<ImageView>(R.id.appCardArtwork)
                          val border = holder.itemView.findViewById<View>(R.id.focusBorder)
                          val badge = holder.itemView.findViewById<TextView>(R.id.tvCardBadge)

                          cardView.outlineProvider = ViewOutlineProvider.BACKGROUND
                          cardView.clipToOutline = true
                          artwork.setImageBitmap(app.cardBitmap)

                          badge.visibility = if (movingPackage == app.packageName) View.VISIBLE else View.GONE

                          cardView.setOnFocusChangeListener { v, hasFocus ->
                              if (hasFocus) {
                                  findViewById<TextView>(R.id.tvFocusedAppTitle).text = app.label
                                  loadWallpaperState(app.brandColor)
                                  v.animate()
                                      .scaleX(1.14f)
                                      .scaleY(1.14f)
                                      .translationY(-6f)
                                      .translationZ(28f)
                                      .setInterpolator(OvershootInterpolator(1.3f))
                                      .setDuration(200)
                                      .start()
                                  border.animate().alpha(1f).setDuration(140).start()
                              } else {
                                  v.animate()
                                      .scaleX(1.0f)
                                      .scaleY(1.0f)
                                      .translationY(0f)
                                      .translationZ(0f)
                                      .setDuration(170)
                                      .start()
                                  border.animate().alpha(0f).setDuration(140).start()
                              }
                          }

                          cardView.setOnClickListener {
                              if (movingPackage != null) {
                                  movingPackage = null
                                  badge.visibility = View.GONE
                                  saveCurrentAppOrder()
                                  Toast.makeText(this@MainActivity, "Позиция «${app.label}» сохранена", Toast.LENGTH_SHORT).show()
                              } else {
                                  launchPackage(app.packageName)
                              }
                          }

                          cardView.setOnLongClickListener {
                              val options = arrayOf(
                                  "🎮 Привязать «${app.label}» к любой кнопке пульта",
                                  "↔️ Переместить карточку (стрелками ◄ ►)",
                                  "👁 Скрыть «${app.label}» с главного экрана",
                                  "▶️ Открыть «${app.label}»",
                                  "ℹ️ Системная информация о приложении"
                              )
                              AlertDialog.Builder(this@MainActivity)
                                  .setTitle(app.label)
                                  .setItems(options) { _, which ->
                                      when (which) {
                                          0 -> startInteractiveButtonCapture(app.packageName, app.label)
                                          1 -> {
                                              movingPackage = app.packageName
                                              badge.visibility = View.VISIBLE
                                              Toast.makeText(this@MainActivity, "Двигайте «${app.label}» стрелками ◄ ► и нажмите OK", Toast.LENGTH_SHORT).show()
                                          }
                                          2 -> hidePackage(app.packageName, app.label)
                                          3 -> launchPackage(app.packageName)
                                          4 -> {
                                              try {
                                                  val i = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                                                  i.data = Uri.parse("package:${app.packageName}")
                                                  startActivity(i)
                                              } catch (_: Exception) {}
                                          }
                                      }
                                  }
                                  .show()
                              true
                          }

                          cardView.setOnKeyListener { _, keyCode, event ->
                              if (movingPackage == app.packageName && event.action == KeyEvent.ACTION_DOWN) {
                                  val currentPos = holder.bindingAdapterPosition
                                  if (currentPos == RecyclerView.NO_POSITION) return@setOnKeyListener false

                                  when (keyCode) {
                                      KeyEvent.KEYCODE_DPAD_LEFT -> {
                                          if (currentPos > 0) {
                                              Collections.swap(allApps, currentPos, currentPos - 1)
                                              notifyItemMoved(currentPos, currentPos - 1)
                                              saveCurrentAppOrder()
                                          }
                                          return@setOnKeyListener true
                                      }
                                      KeyEvent.KEYCODE_DPAD_RIGHT -> {
                                          if (currentPos < allApps.size - 1) {
                                              Collections.swap(allApps, currentPos, currentPos + 1)
                                              notifyItemMoved(currentPos, currentPos + 1)
                                              saveCurrentAppOrder()
                                          }
                                          return@setOnKeyListener true
                                      }
                                  }
                              }
                              false
                          }
                      }
                  }
              }

              private fun startStatusAndWeatherUpdates() {
                  updateNetworkAndVpnStatus()
                  fetchLiveWeather()

                  mainHandler.postDelayed(object : Runnable {
                      override fun run() {
                          updateGreetingAndDate()
                          updateNetworkAndVpnStatus()
                          mainHandler.postDelayed(this, 6000)
                      }
                  }, 6000)
              }

              private fun updateNetworkAndVpnStatus() {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val vpnDot = findViewById<View>(R.id.vpnActiveDot)

                  var isVpn = false
                  for (net in cm.allNetworks) {
                      val c = cm.getNetworkCapabilities(net)
                      if (c != null && c.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) {
                          isVpn = true
                      }
                  }
                  vpnDot.visibility = if (isVpn) View.VISIBLE else View.GONE
              }

              private fun fetchLiveWeather() {
                  thread {
                      try {
                          val url = URL("https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.61&current_weather=true")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 5000
                          conn.readTimeout = 5000
                          val text = conn.inputStream.bufferedReader().readText()
                          val current = JSONObject(text).getJSONObject("current_weather")
                          val temp = Math.round(current.getDouble("temperature"))
                          val sign = if (temp > 0) "+$temp" else "$temp"
                          mainHandler.post {
                              findViewById<TextView>(R.id.tvWeather).text = "⛅ ${sign}°C"
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun openBuiltInAiWebView() {
                  val dialog = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B0D14"))
                  }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(36, 20, 36, 20)
                      setBackgroundColor(Color.parseColor("#161924"))
                  }
                  val title = TextView(this).apply {
                      text = "✨ Siri / Gemini / ChatGPT"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                  }
                  val webView = WebView(this)
                  val btnGemini = Button(this).apply {
                      text = "Gemini"
                      setOnClickListener { webView.loadUrl("https://gemini.google.com") }
                  }
                  val btnChatGpt = Button(this).apply {
                      text = "ChatGPT"
                      setOnClickListener { webView.loadUrl("https://chatgpt.com") }
                  }
                  val btnClose = Button(this).apply {
                      text = "Закрыть ✕"
                      setOnClickListener { dialog.dismiss() }
                  }
                  topBar.addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  topBar.addView(btnGemini)
                  topBar.addView(btnChatGpt)
                  topBar.addView(btnClose)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.loadUrl(prefs.getString("ai_default_url", "https://chatgpt.com") ?: "https://chatgpt.com")

                  container.addView(topBar)
                  container.addView(webView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  dialog.setContentView(container)
                  dialog.show()
              }

              private fun registerBuiltInAirPlayService() {
                  try {
                      nsdManager = getSystemService(Context.NSD_SERVICE) as NsdManager
                      val serviceInfo = NsdServiceInfo().apply {
                          serviceName = "Apple TV"
                          serviceType = "_airplay._tcp."
                          port = 7000
                      }
                      registrationListener = object : NsdManager.RegistrationListener {
                          override fun onServiceRegistered(info: NsdServiceInfo) {}
                          override fun onRegistrationFailed(info: NsdServiceInfo, errorCode: Int) {}
                          override fun onServiceUnregistered(info: NsdServiceInfo) {}
                          override fun onUnregistrationFailed(info: NsdServiceInfo, errorCode: Int) {}
                      }
                      nsdManager?.registerService(serviceInfo, NsdManager.PROTOCOL_DNS_SD, registrationListener)
                  } catch (_: Exception) {}
              }

              private fun launchVpnOrSettings() {
                  val vpnKeywords = listOf("happ", "vpn", "v2ray", "nekobox", "outline", "wireguard", "openvpn", "adguard", "windscribe", "proton", "hidemy")
                  val vpnApp = allApps.firstOrNull { app ->
                      vpnKeywords.any { kw -> app.label.lowercase().contains(kw) || app.packageName.lowercase().contains(kw) }
                  }
                  if (vpnApp != null) {
                      Toast.makeText(this, "🛡 Запуск VPN: ${vpnApp.label}", Toast.LENGTH_SHORT).show()
                      launchPackage(vpnApp.packageName)
                  } else {
                      try {
                          startActivity(Intent(Settings.ACTION_VPN_SETTINGS))
                      } catch (_: Exception) {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  }
              }

              private fun launchPackage(pkg: String) {
                  val intent = packageManager.getLaunchIntentForPackage(pkg)
                      ?: packageManager.getLeanbackLaunchIntentForPackage(pkg)
                  if (intent != null) startActivity(intent)
              }

              private fun showAppleTvSettingsDialog() {
                  val hiddenCount = getHiddenPackages().size
                  val items = arrayOf(
                      "🖼 Выбрать свое фото на обои (из папки Download / Галереи)",
                      "🎮 Переназначить кнопки пульта (Okko, Иви, Смотрим, VK, Rutube)",
                      "👁 Управление скрытыми приложениями (скрыто: $hiddenCount)",
                      "✨ Открыть голосовой/текстовый ИИ (Siri / Gemini / ChatGPT)",
                      "🔄 Сбросить порядок иконок по умолчанию",
                      "⚙️ Открыть системные настройки Android TV"
                  )

                  AlertDialog.Builder(this)
                      .setTitle(" Настройки Apple TV v7.0")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showPhotoWallpaperPickerDialog()
                              1 -> showMultiButtonRemapManagerDialog()
                              2 -> showHiddenPackagesManagerDialog()
                              3 -> openBuiltInAiWebView()
                              4 -> {
                                  prefs.edit().remove("saved_app_order").apply()
                                  refreshApps()
                                  Toast.makeText(this, "Порядок иконок сброшен", Toast.LENGTH_SHORT).show()
                              }
                              5 -> startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                      .show()
              }
          }
