                      "🎬 Обои: Живое 4K видео Apple Aerial",
                      "🔄 Сбросить порядок иконок по умолчанию",
                      "⚙️ Системные настройки Android TV"
                  )

                  AlertDialog.Builder(this)
                      .setTitle(" Настройки VibeTV (Apple TV Launcher)")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showHiddenPackagesManagerDialog()
                              1 -> openBuiltInAiWebView()
                              2 -> showButtonActionPicker()
                              3 -> {
                                  prefs.edit().putBoolean("capture_next_key", true).apply()
                                  Toast.makeText(this, "Нажмите сейчас кнопку «СМОТРИМ» на пульте!", Toast.LENGTH_LONG).show()
                              }
                              4 -> {
                                  prefs.edit().putInt("wallpaper_mode", 0).apply()
                                  applyWallpaperTheme(Color.parseColor("#1D3557"))
                              }
                              5 -> {
                                  prefs.edit().putInt("wallpaper_mode", 1).apply()
                                  applyWallpaperTheme(Color.parseColor("#1D3557"))
                              }
                              6 -> {
                                  prefs.edit().putInt("wallpaper_mode", 2).apply()
                                  applyWallpaperTheme(Color.parseColor("#3B1C32"))
                              }
                              7 -> {
                                  prefs.edit().putInt("wallpaper_mode", 3).apply()
                                  applyWallpaperTheme(Color.BLACK)
                              }
                              8 -> {
                                  prefs.edit().remove("saved_app_order").apply()
                                  refreshApps()
                                  Toast.makeText(this, "Порядок иконок сброшен", Toast.LENGTH_SHORT).show()
                              }
                              9 -> startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                      .show()
              }

              private fun showButtonActionPicker() {
                  val labels = mutableListOf(
                      "🛡 Включить VPN (Happ / v2rayNG / Системный VPN)",
                      "🎬 Запустить Wink (Винк)",
                      "🍿 Запустить Кинопоиск",
                      "▶️ Запустить YouTube",
                      "✨ Открыть Siri / Gemini / ChatGPT"
                  )
                  val values = mutableListOf("vpn", "wink", "kinopoisk", "youtube", "ai")

                  for (app in allApps) {
                      labels.add("📱 Приложение: ${app.label}")
                      values.add(app.packageName)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Что делать при нажатии кнопки «СМОТРИМ»?")
                      .setItems(labels.toTypedArray()) { _, idx ->
                          prefs.edit().putString("smotrim_action", values[idx]).apply()
                          Toast.makeText(this, "Кнопка «СМОТРИМ» назначена на: ${labels[idx]}", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleTV-Vibe-Launcher-v6.0
          path: app/build/outputs/apk/debug/app-debug.apk
