              private fun showButtonActionPicker() {
                  val labels = mutableListOf(
                      "🛡 Включить VPN клиент (или системный VPN)",
                      "🎬 Запустить Wink (Винк)",
                      "🍿 Запустить Кинопоиск",
                      "▶️ Запустить YouTube / SmartTube",
                      "✨ Открыть Siri / Gemini / ChatGPT"
                  )
                  val values = mutableListOf("vpn", "wink", "kinopoisk", "youtube", "ai")

                  for (app in allApps) {
                      labels.add("📱 Приложение: ${app.label}")
                      values.add(app.packageName)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Что делать при нажатии кнопки «СМОТРИМ»?")
                      .setItems(labels.toTypedArray()) { _, idx ->
                          prefs.edit().putString("smotrim_action", values[idx]).apply()
                          Toast.makeText(this, "Кнопка «СМОТРИМ» назначена на: ${labels[idx]}", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              override fun onResume() {
                  super.onResume()
                  updateNetworkAndVpnStatus()
                  val mode = prefs.getInt("wallpaper_mode", 0)
                  if (mode == 0 || mode == 1) {
                      findViewById<VideoView>(R.id.aerialVideoView).start()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      registrationListener?.let { nsdManager?.unregisterService(it) }
                  } catch (_: Exception) {}
              }
          }
          EOF

          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleTV-Vibe-Launcher-v5.0-Ultimate
          path: app/build/outputs/apk/debug/app-debug.apk
