              // =========================================================================
              // СИСТЕМНЫЙ AIRPLAY NSD БЕЗ СТОРОННЕГО СОФТА (Пункт 3 из тетради)
              // =========================================================================
              private fun registerBuiltInAirPlayService() {
                  try {
                      nsdManager = getSystemService(Context.NSD_SERVICE) as NsdManager
                      val serviceInfo = NsdServiceInfo().apply {
                          serviceName = "Apple TV"
                          serviceType = "_airplay._tcp."
                          port = 7000
                      }
                      registrationListener = object : NsdManager.RegistrationListener {
                          override fun onServiceRegistered(info: NsdServiceInfo) {}
                          override fun onRegistrationFailed(info: NsdServiceInfo, errorCode: Int) {}
                          override fun onServiceUnregistered(info: NsdServiceInfo) {}
                          override fun onUnregistrationFailed(info: NsdServiceInfo, errorCode: Int) {}
                      }
                      nsdManager?.registerService(serviceInfo, NsdManager.PROTOCOL_DNS_SD, registrationListener)
                  } catch (_: Exception) {}
              }

              // =========================================================================
              // 5 ИЗ ТЕТРАДИ: ПЕРЕНАЗНАЧЕНИЕ КНОПКИ «СМОТРИМ» И ДРУГИХ КНОПОК ПУЛЬТА
              // =========================================================================
              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  // Если включен режим захвата любой кнопки пульта в настройках
                  if ( prefs.getBoolean("capture_next_key", false) &&
                       keyCode !in listOf(KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_BACK) ) {
                      prefs.edit()
                          .putInt("custom_smotrim_keycode", keyCode)
                          .putBoolean("capture_next_key", false)
                          .apply()
                      Toast.makeText(this, "Кнопка пульта (код $keyCode) успешно привязана!", Toast.LENGTH_LONG).show()
                      return true
                  }

                  val savedSmotrimCode = prefs.getInt("custom_smotrim_keycode", -1)

                  // Перехват кнопки «Смотрим» (и брендированных кнопок пульта Сбера)
                  if (keyCode == savedSmotrimCode || keyCode in listOf(183, 184, 185, 186, 269, 270, 271, 10001, 10002)) {
                      executeMappedRemoteAction()
                      return true
                  }

                  // Замена голосового вызова «Салют» на встроенный Siri / Gemini / ChatGPT
                  if (keyCode == KeyEvent.KEYCODE_SEARCH || keyCode == KeyEvent.KEYCODE_VOICE_ASSIST) {
                      openBuiltInAiWebView()
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }

              private fun executeMappedRemoteAction() {
                  when (val action = prefs.getString("smotrim_action", "vpn") ?: "vpn") {
                      "vpn" -> launchVpnOrSettings()
                      "wink" -> launchAppByKeyword("wink", "винк")
                      "kinopoisk" -> launchAppByKeyword("kinopoisk", "кинопоиск")
                      "youtube" -> launchAppByKeyword("youtube", "smarttube")
                      "ai" -> openBuiltInAiWebView()
                      else -> launchPackage(action)
                  }
              }

              private fun launchVpnOrSettings() {
                  val vpnKeywords = listOf("vpn", "v2ray", "nekobox", "outline", "wireguard", "openvpn", "adguard", "windscribe", "proton", "hidemy")
                  val vpnApp = allApps.firstOrNull { app ->
                      vpnKeywords.any { kw -> app.label.lowercase().contains(kw) || app.packageName.lowercase().contains(kw) }
                  }
                  if (vpnApp != null) {
                      Toast.makeText(this, "🛡 Запуск VPN: ${vpnApp.label}", Toast.LENGTH_SHORT).show()
                      launchPackage(vpnApp.packageName)
                  } else {
                      try {
                          startActivity(Intent(Settings.ACTION_VPN_SETTINGS))
                      } catch (_: Exception) {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  }
              }

              private fun launchAppByKeyword(vararg keywords: String) {
                  val found = allApps.firstOrNull { app ->
                      keywords.any { kw -> app.label.lowercase().contains(kw) || app.packageName.lowercase().contains(kw) }
                  }
                  if (found != null) {
                      launchPackage(found.packageName)
                  } else {
                      Toast.makeText(this, "Приложение не найдено, откройте Настройки ⚙", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun launchPackage(pkg: String) {
                  val intent = packageManager.getLaunchIntentForPackage(pkg)
                      ?: packageManager.getLeanbackLaunchIntentForPackage(pkg)
                  if (intent != null) {
                      startActivity(intent)
                  }
              }

