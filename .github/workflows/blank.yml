import java.text.SimpleDateFormat
import java.util.*
import kotlin.concurrent.thread

data class AppEntry(
val label: String,
val packageName: String,
val icon: Drawable,
val banner: Drawable?,
val brandColor: Int,
val cardBitmap: Bitmap
)

class MainActivity : AppCompatActivity() {

private lateinit var prefs: SharedPreferences
private var allApps = mutableListOf<AppEntry>()

private var movingPackage: String? = null
private val mainHandler = Handler(Looper.getMainLooper())

private var lastAccent = Color.parseColor("#1D3557")
private var customWallpaperActive = false

private val gradientPresets: List<Pair<String, IntArray?>> = listOf(
"Динамический (цвет приложения)" to null,
"Полночь" to intArrayOf(Color.parseColor("#14213D"), Color.parseColor("#080D1A"), Color.parseColor("#020408")),
"Северное сияние" to intArrayOf(Color.parseColor("#0F4C5C"), Color.parseColor("#1B2A49"), Color.parseColor("#07090F")),
"Закат" to intArrayOf(Color.parseColor("#5B2A86"), Color.parseColor("#2B1B4F"), Color.parseColor("#0A0714")),
"Графит" to intArrayOf(Color.parseColor("#3A3F4B"), Color.parseColor("#1C1F27"), Color.parseColor("#0A0B0E"))
)

companion object {
private const val REQ_PICK_WALLPAPER_IMAGE = 9001
private const val REQ_STORAGE_PERMISSION = 9002
private const val AIRPLAY_TARGET = "action:airplay"
}

private fun dlg(): AlertDialog.Builder = AlertDialog.Builder(this, R.style.AppleDialog)

override fun onCreate(savedInstanceState: Bundle?) {
super.onCreate(savedInstanceState)
setContentView(R.layout.activity_main)

prefs = getSharedPreferences("apple_tv_vibetv_v7_prefs", Context.MODE_PRIVATE)

setupTopHeader()
applyWallpaper()
refreshApps()
startStatusAndWeatherUpdates()
}

override fun onDestroy() {
