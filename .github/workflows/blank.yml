              private fun resolveTargetLabel(target: String): String {
                  if (target == "action:vpn") return "🛡 VPN"
                  if (target == "action:ai") return "✨ Siri / Gemini"
                  val found = allApps.firstOrNull { it.packageName == target }
                  return found?.label ?: target
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  // Проверяем индивидуальные привязки кнопок пользователя
                  val customTarget = prefs.getString("remap_key_$keyCode", null)
                  if (customTarget != null) {
                      executeTargetAction(customTarget)
                      return true
                  }

                  // Запасной перехват стандартных кодов брендированных кнопок, если еще не настроены вручную
                  if (keyCode in listOf(183, 184, 185, 186, 269, 270, 271, 10001, 10002)) {
                      val fallback = prefs.getString("default_branded_action", "action:vpn") ?: "action:vpn"
                      executeTargetAction(fallback)
                      return true
                  }

                  if (keyCode == KeyEvent.KEYCODE_SEARCH || keyCode == KeyEvent.KEYCODE_VOICE_ASSIST) {
                      openBuiltInAiWebView()
                      return true
                  }

                  return super.onKeyDown(keyCode, event)
              }

              private fun executeTargetAction(target: String) {
                  when (target) {
                      "action:vpn" -> launchVpnOrSettings()
                      "action:ai" -> openBuiltInAiWebView()
                      else -> launchPackage(target)
                  }
              }

