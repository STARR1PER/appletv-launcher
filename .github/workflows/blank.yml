name: Build Apple tvOS VibeTV Launcher v7.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-tvos-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Zulu JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/appletv/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppleTvLauncher"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.appletv.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.appletv.launcher"
                  minSdk 24
                  targetSdk 33
                  versionCode 35
                  versionName "7.0.0-PhotoEdition"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_tvos_logo"
                  android:banner="@drawable/ic_tvos_logo"
                  android:label="Apple TV"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.AppleTv">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:excludeFromRecents="true"
                      android:screenOrientation="landscape">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="tvos_bg_dark">#060B19</color>
              <color name="tvos_text_primary">#FFFFFF</color>
              <color name="tvos_dock_glass">#28FFFFFF</color>
              <color name="tvos_dock_stroke">#45FFFFFF</color>
              <color name="tvos_pill_bg">#28FFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppleTv" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/tvos_bg_dark</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_dock_glass.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="28dp" />
              <solid android:color="@color/tvos_dock_glass" />
              <stroke android:width="1.2dp" android:color="@color/tvos_dock_stroke" />
          </shape>
          EOF

          # Капсула для кнопки "Источники" с поддержкой подсветки при наведении пульта
          cat << 'EOF' > app/src/main/res/drawable/bg_top_pill_selector.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <corners android:radius="100dp" />
                      <solid android:color="#55FFFFFF" />
                      <stroke android:width="2dp" android:color="#FFFFFFFF" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="100dp" />
                      <solid android:color="#28FFFFFF" />
                      <stroke android:width="1dp" android:color="#40FFFFFF" />
                  </shape>
              </item>
          </selector>
          EOF

          # Идеально круглая форма (oval) для кнопок Wi-Fi и Настроек, чтобы никогда не становились квадратными
          cat << 'EOF' > app/src/main/res/drawable/bg_circle_selector.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="oval">
                      <solid android:color="#55FFFFFF" />
                      <stroke android:width="2dp" android:color="#FFFFFFFF" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#28FFFFFF" />
                      <stroke android:width="1dp" android:color="#40FFFFFF" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_vpn_dot.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#30D158" />
              <stroke android:width="1.5dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_rounded.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="18dp" />
              <solid android:color="#1C1C1E" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_focus_border.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="18dp" />
              <solid android:color="#00000000" />
              <stroke android:width="3.5dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_wifi.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="20dp" android:height="20dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,21L15.6,16.2C14.6,15.45 13.35,15 12,15C10.65,15 9.4,15.45 8.4,16.2L12,21ZM12,3C7.95,3 4.21,4.34 1.2,6.6L3,9C5.5,7.12 8.62,6 12,6C15.38,6 18.5,7.12 21,9L22.8,6.6C19.79,4.34 16.05,3 12,3ZM12,9C9.3,9 6.81,9.89 4.8,11.4L6.6,13.8C8.1,12.67 9.97,12 12,12C14.03,12 15.9,12.67 17.4,13.8L19.2,11.4C17.19,9.89 14.7,9 12,9Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_tvos_logo.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M21,3H3C1.9,3 1,3.9 1,5v12c0,1.1 0.9,2 2,2h5v2h8v-2h5c1.1,0 2,-0.9 2,-2V5C23,3.9 22.1,3 21,3zM21,17H3V5h18V17z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:clipChildren="false"
              android:clipToPadding="false"
              android:background="@color/tvos_bg_dark">

              <!-- Фоновая картинка для пользовательских фото-обоев (никаких тормозящих VideoView!) -->
              <ImageView
                  android:id="@+id/customWallpaperImage"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop"
                  android:visibility="gone" />

              <!-- Легкое атмосферное затемнение/градиент -->
              <View
                  android:id="@+id/ambientGlowView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <!-- ВЕРХНЯЯ ПАНЕЛЬ С ОТКЛЮЧЕННЫМ ОБРЕЗАНИЕМ (clipChildren="false"), ЧТОБЫ КРУГЛЫЕ КНОПКИ НЕ СТАНОВИЛИСЬ КВАДРАТНЫМИ -->
              <LinearLayout
                  android:id="@+id/topHeader"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="64dp"
                  android:layout_marginEnd="64dp"
                  android:layout_marginTop="36dp"
                  android:padding="12dp"
                  android:clipChildren="false"
                  android:clipToPadding="false"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/tvGreeting"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ДОБРЫЙ ВЕЧЕР"
                          android:textColor="#B3FFFFFF"
                          android:textSize="11sp"
                          android:shadowColor="#80000000"
                          android:shadowDx="0"
                          android:shadowDy="1"
                          android:shadowRadius="4"
                          android:letterSpacing="0.08"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextClock
                              android:id="@+id/tvClock"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:format24Hour="HH:mm"
                              android:format12Hour="HH:mm"
                              android:textColor="@color/tvos_text_primary"
                              android:textSize="44sp"
                              android:shadowColor="#99000000"
                              android:shadowDx="0"
                              android:shadowDy="2"
                              android:shadowRadius="6"
                              android:fontFamily="sans-serif-light" />

                          <TextView
                              android:id="@+id/tvDateTwoLine"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="14dp"
                              android:lineSpacingExtra="2dp"
                              android:text="ВОСКРЕСЕНЬЕ\n25 ОКТЯБРЯ"
                              android:textColor="#D9FFFFFF"
                              android:textSize="11sp"
                              android:shadowColor="#80000000"
                              android:shadowDx="0"
                              android:shadowDy="1"
                              android:shadowRadius="4"
                              android:letterSpacing="0.04"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/tvWeather"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="18dp"
                              android:text="⛅ +18°C"
                              android:textColor="#EEFFFFFF"
                              android:textSize="14sp"
                              android:shadowColor="#80000000"
                              android:shadowDx="0"
                              android:shadowDy="1"
                              android:shadowRadius="4"
                              android:fontFamily="sans-serif-medium" />
                      </LinearLayout>
                  </LinearLayout>

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <!-- Правый блок с круглыми кнопками -->
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:padding="10dp"
                      android:clipChildren="false"
                      android:clipToPadding="false"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/btnSources"
                          android:layout_width="wrap_content"
                          android:layout_height="44dp"
                          android:layout_marginEnd="14dp"
                          android:background="@drawable/bg_top_pill_selector"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="20dp"
                          android:paddingEnd="20dp"
                          android:text="📺  Источники"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <FrameLayout
                          android:id="@+id/btnWifiStatus"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:layout_marginEnd="14dp"
                          android:background="@drawable/bg_circle_selector"
                          android:clickable="true"
                          android:focusable="true">

                          <ImageView
                              android:layout_width="20dp"
                              android:layout_height="20dp"
                              android:layout_gravity="center"
                              android:src="@drawable/ic_wifi" />

                          <View
                              android:id="@+id/vpnActiveDot"
                              android:layout_width="10dp"
                              android:layout_height="10dp"
                              android:layout_gravity="top|end"
                              android:layout_margin="5dp"
                              android:background="@drawable/bg_vpn_dot"
                              android:visibility="gone" />
                      </FrameLayout>

                      <TextView
                          android:id="@+id/btnSettings"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:background="@drawable/bg_circle_selector"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:text="⚙"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp" />
                  </LinearLayout>
              </LinearLayout>

              <!-- ОГРОМНОЕ СВОБОДНОЕ МЕСТО ПОСЕРЕДИНЕ ЭКРАНА! -->
              <!-- Док и заголовок опущены в самый низ экрана -->

              <LinearLayout
                  android:id="@+id/focusedTitleBlock"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="72dp"
                  android:layout_marginBottom="14dp"
                  android:orientation="vertical"
                  app:layout_constraintBottom_toTopOf="@id/dockGlassBar"
                  app:layout_constraintStart_toStartOf="parent">

                  <TextView
                      android:id="@+id/tvFocusedAppTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="YouTube"
                      android:textColor="#FFFFFF"
                      android:textSize="32sp"
                      android:shadowColor="#CC000000"
                      android:shadowDx="0"
                      android:shadowDy="3"
                      android:shadowRadius="8"
                      android:textStyle="bold"
                      android:fontFamily="sans-serif-medium" />

                  <TextView
                      android:id="@+id/tvFocusedAppHint"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Удерживайте OK — скрыть, переместить или привязать к кнопке пульта"
                      android:textColor="#B3FFFFFF"
                      android:shadowColor="#AA000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textSize="11sp" />
              </LinearLayout>

              <!-- Единый длинный стеклянный ряд внизу экрана (листается горизонтально, освобождая весь центр) -->
              <LinearLayout
                  android:id="@+id/dockGlassBar"
                  android:layout_width="0dp"
                  android:layout_height="118dp"
                  android:layout_marginStart="64dp"
                  android:layout_marginEnd="64dp"
                  android:layout_marginBottom="46dp"
                  android:background="@drawable/bg_dock_glass"
                  android:paddingStart="18dp"
                  android:paddingEnd="18dp"
                  android:clipChildren="false"
                  android:clipToPadding="false"
                  android:gravity="center_vertical"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/dockRecycler"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:clipChildren="false"
                      android:clipToPadding="false" />
              </LinearLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_app_tile.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:clipChildren="false"
              android:clipToPadding="false"
              android:paddingStart="10dp"
              android:paddingEnd="10dp"
              android:paddingTop="8dp"
              android:paddingBottom="8dp">

              <FrameLayout
                  android:id="@+id/appCardView"
                  android:layout_width="148dp"
                  android:layout_height="84dp"
                  android:layout_gravity="center"
                  android:background="@drawable/bg_card_rounded"
                  android:clickable="true"
                  android:focusable="true"
                  android:elevation="6dp">

                  <ImageView
                      android:id="@+id/appCardArtwork"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="centerCrop" />

                  <TextView
                      android:id="@+id/tvCardBadge"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="top|end"
                      android:layout_margin="5dp"
                      android:background="#DD007AFF"
                      android:paddingStart="6dp"
                      android:paddingEnd="6dp"
                      android:paddingTop="2dp"
                      android:paddingBottom="2dp"
                      android:text="◄ ДВИГАТЬ ►"
                      android:textColor="#FFFFFF"
                      android:textSize="8sp"
                      android:textStyle="bold"
                      android:visibility="gone" />

                  <View
                      android:id="@+id/focusBorder"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="@drawable/bg_focus_border"
                      android:alpha="0" />
              </FrameLayout>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/appletv/launcher/MainActivity.kt
          package com.appletv.launcher

          import android.Manifest
          import android.app.Activity
          import android.app.Dialog
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.content.pm.ResolveInfo
          import android.graphics.*
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.net.nsd.NsdManager
          import android.net.nsd.NsdServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.animation.OvershootInterpolator
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.concurrent.thread

          data class AppEntry(
              val label: String,
              val packageName: String,
              val icon: Drawable,
              val banner: Drawable?,
              val brandColor: Int,
              val cardBitmap: Bitmap
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: SharedPreferences
              private var allApps = mutableListOf<AppEntry>()

              private var movingPackage: String? = null
              private var pendingCaptureTargetValue: String? = null
              private var pendingCaptureTargetLabel: String? = null

              private var nsdManager: NsdManager? = null
              private var registrationListener: NsdManager.RegistrationListener? = null
              private val mainHandler = Handler(Looper.getMainLooper())

              companion object {
                  private const val REQ_PICK_WALLPAPER_IMAGE = 9001
                  private const val REQ_STORAGE_PERMISSION = 9002
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences("apple_tv_vibetv_v7_prefs", Context.MODE_PRIVATE)

                  setupTopHeader()
                  loadWallpaperState(Color.parseColor("#1D3557"))
                  refreshApps()
                  startStatusAndWeatherUpdates()
                  registerBuiltInAirPlayService()
              }

              private fun setupTopHeader() {
                  updateGreetingAndDate()

                  findViewById<View>(R.id.btnSources).apply {
                      setupTopButtonFocus(this)
                      setOnClickListener { showSourcesPopupMenu(this) }
                  }

                  findViewById<View>(R.id.btnWifiStatus).apply {
                      setupTopButtonFocus(this)
                      setOnClickListener { launchVpnOrSettings() }
                      setOnLongClickListener {
                          try { startActivity(Intent(Settings.ACTION_WIFI_SETTINGS)) } catch (_: Exception) {}
                          true
                      }
                  }

                  findViewById<View>(R.id.btnSettings).apply {
                      setupTopButtonFocus(this)
                      setOnClickListener { showAppleTvSettingsDialog() }
                  }
              }

